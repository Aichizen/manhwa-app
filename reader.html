<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chapter</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="account.js"></script>


    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        body.reader-body {
            padding-top: 82px;
            overflow-x: hidden;
        }

        .reader-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 82px;
            z-index: 99999;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: rgba(15, 18, 40, .98);
            box-shadow: 0 4px 18px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .reader-back {
            flex: 0 0 50px;
            width: 50px;
            height: 50px;
            margin-right: 13px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3b4168;
            color: #fff;
            cursor: pointer;
        }

        .reader-back svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-title-area {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #readerMangaTitle {
            color: #aaa9bd;
            font-size: 12px;
            line-height: 1.1;
            letter-spacing: 1.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #readerTitle {
            margin: 2px 0 0;
            color: #f5f3fa;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            line-height: 1.05;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #pdf-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            line-height: 0;
            font-size: 0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        #pdf-container .pdf-page {
            display: block;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            line-height: 0;
            font-size: 0;
        }

        #pdf-container canvas {
            display: block;
            width: 100% !important;
            max-width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .reader-loading {
            position: fixed;
            top: 82px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #aaa9bd;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            margin-bottom: 14px;
            border: 3px solid #444;
            border-top-color: #fff;
            border-radius: 50%;
            animation: reader-spin .8s linear infinite;
        }

        @keyframes reader-spin {
            to { transform: rotate(360deg); }
        }

        .reader-error {
            min-height: 300px;
            box-sizing: border-box;
            padding: 30px 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #000;
            color: #aaa9bd;
        }

        @media (max-width: 480px) {
            body.reader-body {
                padding-top: 82px;
            }

            .reader-header {
                height: 82px;
                padding: 10px 14px;
            }

            .reader-back {
                flex-basis: 48px;
                width: 48px;
                height: 48px;
                margin-right: 12px;
            }

            #readerTitle {
                font-size: 22px;
            }

            #readerMangaTitle {
                font-size: 11px;
            }
        }
    </style>

</head>


<body class="reader-body">


    <!-- HEADER READER -->

    <header class="reader-header">

        <button
            class="reader-back"
            onclick="history.back()"
            aria-label="Kembali"
        >

            <svg viewBox="0 0 24 24">

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

        </button>


        <div class="reader-title-area">

            <span id="readerMangaTitle">
                STORY ABOUT US
            </span>

            <h1 id="readerTitle">
                Chapter 1
            </h1>

        </div>

    </header>



    <!-- LOADING -->

    <div
        id="loading"
        class="reader-loading"
    >

        <div class="loading-spinner"></div>

        <p>Loading chapter...</p>

    </div>



    <!-- ERROR -->

    <div
        id="error"
        class="reader-error"
        style="display: none;"
    >

        <div class="error-icon">
            !
        </div>

        <h2>Chapter tidak dapat dibuka</h2>

        <p id="errorMessage">
            Terjadi kesalahan saat memuat PDF.
        </p>

        <button
            onclick="location.reload()"
            class="retry-button"
        >
            Coba Lagi
        </button>

    </div>



    <!-- PDF -->

    <main id="pdf-container"></main>



    <!-- PDF.JS -->

    <script type="module">

        import * as pdfjsLib from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



        /* ==========================================
           TELEGRAM
        ========================================== */

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();



        /* ==========================================
           AMBIL PARAMETER URL
        ========================================== */

        const params =
            new URLSearchParams(window.location.search);


        const title =
            params.get("title");


        const chapter =
            params.get("chapter");



        /* ==========================================
           API
        ========================================== */

        const API_BASE =
            "https://story-about-us-api.aichinose219.workers.dev";

        let chapters = [];
        let currentChapterIndex = -1;
        let isLoadingChapter = false;
        let resumePage = Math.max(1, Number(params.get("page") || 1));
        let progressSaveTimer = null;


        /* ==========================================
           CEK DATA
        ========================================== */

        if (!title) {

            showError("Judul manga tidak ditemukan.");

        } else if (!chapter) {

            showError("Nomor chapter tidak ditemukan.");

        } else {

            startReader();

        }


        /* ==========================================
           MULAI READER
        ========================================== */

        async function startReader() {

            try {
                await ReaderAccount.init();

                const chapterNumber =
                    parseFloat(chapter);


                if (
                    !Number.isFinite(chapterNumber) ||
                    chapterNumber < 0
                ) {

                    throw new Error(
                        "Nomor chapter tidak valid."
                    );

                }


                /* ================================
                   AMBIL DAFTAR CHAPTER DARI API
                ================================= */

                const response =
                    await fetch(
                        API_BASE +
                        "/api/manga/" +
                        encodeURIComponent(title)
                    );


                if (!response.ok) {

                    throw new Error(
                        "Daftar chapter tidak dapat dimuat."
                    );

                }


                const mangaData = await response.json();
                chapters = Array.isArray(mangaData)
                    ? mangaData
                    : (Array.isArray(mangaData.chapters) ? mangaData.chapters : []);


                if (!Array.isArray(chapters) || !chapters.length) {

                    throw new Error(
                        "Chapter tidak ditemukan."
                    );

                }


                chapters.sort(
                    (a, b) =>
                        Number(a.number || 0) -
                        Number(b.number || 0)
                );


                currentChapterIndex =
                    chapters.findIndex(
                        item =>
                            Number(item.number) ===
                            chapterNumber
                    );


                if (currentChapterIndex === -1) {

                    throw new Error(
                        "Chapter " +
                        chapterNumber +
                        " tidak ditemukan."
                    );

                }


                updateHeader(
                    chapterNumber
                );


                await loadCurrentChapter();


                window.addEventListener(
                    "scroll",
                    handleScroll,
                    { passive: true }
                );


            } catch (error) {

                console.error(error);

                showError(
                    error.message ||
                    "PDF gagal dimuat."
                );

            }

        }


        /* ==========================================
           HEADER
        ========================================== */

        function updateHeader(chapterNumber) {
            const chapterItem = chapters.find(item => Number(item.number) === Number(chapterNumber));
            const displayChapter = chapterItem?.label || String(chapterNumber).split(".")[0];

            document.title =
                title.replace(/-/g, " ") +
                " - Chapter " +
                displayChapter;


            document.getElementById(
                "readerMangaTitle"
            ).textContent =
                title
                    .replace(/-/g, " ")
                    .replace(/\b\w/g, letter =>
                        letter.toUpperCase()
                    );


            document.getElementById(
                "readerTitle"
            ).textContent =
                "Chapter " +
                displayChapter;

        }


        /* ==========================================
           LOAD CURRENT CHAPTER
        ========================================== */

        async function loadCurrentChapter() {

            if (isLoadingChapter) {
                return;
            }

            isLoadingChapter = true;


            const item =
                chapters[currentChapterIndex];


            if (!item) {

                isLoadingChapter = false;

                throw new Error(
                    "Data chapter tidak ditemukan."
                );

            }


            let pdfUrl =
                item.url ||
                item.pdf ||
                item.file;


            if (!pdfUrl && item.key) {

                pdfUrl =
                    "https://cdn.storyabout-us.com/" +
                    item.key;

            }


            if (!pdfUrl) {

                throw new Error(
                    "Alamat PDF chapter tidak ditemukan."
                );

            }


            console.log(
                "PDF URL:",
                pdfUrl
            );


            updateHeader(
                Number(item.number)
            );


            window.scrollTo({
                top: 0,
                behavior: "auto"
            });


            try {

                await loadPDF(pdfUrl);
                if (resumePage > 1) {
                    const pageNode = [...document.querySelectorAll(".pdf-page")].find(node => Number(node.dataset.page) === resumePage);
                    if (pageNode) pageNode.scrollIntoView({ behavior: "auto", block: "start" });
                }
                resumePage = 1;
                saveVisibleProgress();

            } finally {

                isLoadingChapter = false;

            }

        }


        /* ==========================================
           DETEKSI AKHIR CHAPTER
        ========================================== */

        let bottomTimer = null;

        function handleScroll() {

            if (isLoadingChapter) {
                return;
            }

            scheduleProgressSave();


            if (bottomTimer) {
                return;
            }


            const distanceFromBottom =
                document.documentElement.scrollHeight -
                (
                    window.scrollY +
                    window.innerHeight
                );


            if (distanceFromBottom <= 160) {

                bottomTimer =
                    setTimeout(
                        async () => {

                            bottomTimer = null;

                            await handleChapterEnd();

                        },
                        250
                    );

            }

        }


        /* ==========================================
           NEXT CHAPTER
        ========================================== */

        function scheduleProgressSave() {
            if (!ReaderAccount.authenticated) return;
            clearTimeout(progressSaveTimer);
            progressSaveTimer = setTimeout(saveVisibleProgress, 900);
        }

        async function saveVisibleProgress() {
            if (!ReaderAccount.authenticated || currentChapterIndex < 0) return;
            const marker = window.scrollY + window.innerHeight * 0.35;
            const pages = [...document.querySelectorAll(".pdf-page[data-page]")];
            let pageNumber = 1;
            for (const node of pages) {
                if (node.getBoundingClientRect().top + window.scrollY <= marker) pageNumber = Number(node.dataset.page) || pageNumber;
                else break;
            }
            const current = chapters[currentChapterIndex];
            try {
                await ReaderAccount.apiFetch("https://story-about-us-api.aichinose219.workers.dev/api/history", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ manga_id: title, chapter_number: Number(current.number), page_number: pageNumber })
                });
            } catch (error) { console.warn("Reading progress was not saved:", error); }
        }

        async function handleChapterEnd() {

            if (isLoadingChapter) {
                return;
            }


            const nextIndex =
                currentChapterIndex + 1;


            if (
                nextIndex <
                chapters.length
            ) {

                currentChapterIndex =
                    nextIndex;


                const nextChapter =
                    chapters[
                        currentChapterIndex
                    ];


                updateHeader(
                    Number(nextChapter.number)
                );


                await loadCurrentChapter();


            } else {

                backToChapters();

            }

        }


        /* ==========================================
           KEMBALI KE DAFTAR CHAPTER
        ========================================== */

        function backToChapters() {

            if (!title) {

                window.location.href =
                    "index.html";

                return;

            }


            window.location.href =
                "chapter.html?title=" +
                encodeURIComponent(title);

        }


        window.goBack =
            backToChapters;



        /* ==========================================
           LOAD PDF.JS
        ========================================== */

        async function loadPDF(pdfUrl) {

            const container =
                document.getElementById(
                    "pdf-container"
                );


            container.innerHTML = "";


            try {

                const loadingTask =
                    pdfjsLib.getDocument({
                        url: pdfUrl,

                        withCredentials: false
                    });


                const pdf =
                    await loadingTask.promise;


                console.log(
                    "Jumlah halaman:",
                    pdf.numPages
                );


                /* ==============================
                   RENDER SEMUA HALAMAN
                ============================== */

                for (
                    let pageNumber = 1;
                    pageNumber <= pdf.numPages;
                    pageNumber++
                ) {

                    await renderPage(
                        pdf,
                        pageNumber,
                        container
                    );

                }


                hideLoading();


            } catch (error) {

                console.error(
                    "PDF.js error:",
                    error
                );


                throw new Error(
                    "PDF tidak dapat dimuat. Periksa koneksi internet atau alamat PDF."
                );

            }

        }



        /* ==========================================
           RENDER SATU HALAMAN
        ========================================== */

        async function renderPage(
            pdf,
            pageNumber,
            container
        ) {

            const page =
                await pdf.getPage(
                    pageNumber
                );


            /* ==============================
               SKALA

               Kita render lebih besar supaya
               gambar tetap tajam di HP.
            ============================== */

            const baseViewport =
                page.getViewport({
                    scale: 1
                });


            const screenWidth =
                container.clientWidth;


            const pixelRatio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            const scale =
                (screenWidth * pixelRatio) /
                baseViewport.width;


            const viewport =
                page.getViewport({
                    scale: scale
                });



            /* ==============================
               WRAPPER HALAMAN
            ============================== */

            const pageWrapper =
                document.createElement(
                    "div"
                );


            pageWrapper.className =
                "pdf-page";
            pageWrapper.dataset.page = String(pageNumber);



            /* ==============================
               CANVAS
            ============================== */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            canvas.style.width =
                "100%";


            canvas.style.height =
                "auto";



            pageWrapper.appendChild(
                canvas
            );


            container.appendChild(
                pageWrapper
            );



            /* ==============================
               RENDER
            ============================== */

            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }



        /* ==========================================
           HIDE LOADING
        ========================================== */

        function hideLoading() {

            const loading =
                document.getElementById(
                    "loading"
                );


            loading.style.display =
                "none";

        }



        /* ==========================================
           ERROR
        ========================================== */

        /* ==========================================
           VIEWER-ONLY UI DETERRENTS
        ========================================== */

        document.addEventListener(
            "contextmenu",
            event => event.preventDefault()
        );


        document.addEventListener(
            "dragstart",
            event => {

                if (
                    event.target.closest(
                        "#pdf-container, .reader-header"
                    )
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "selectstart",
            event => {

                if (
                    event.target.closest(
                        "#pdf-container"
                    )
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                const key =
                    event.key.toLowerCase();

                if (
                    (event.ctrlKey || event.metaKey) &&
                    (key === "s" || key === "p")
                ) {

                    event.preventDefault();

                }

            }
        );


        /* ==========================================
           ERROR
        ========================================== */

        function showError(message) {

            const loading =
                document.getElementById(
                    "loading"
                );


            const error =
                document.getElementById(
                    "error"
                );


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            loading.style.display =
                "none";


            error.style.display =
                "flex";


            errorMessage.textContent =
                message;

        }

    </script>


</body>

</html>
