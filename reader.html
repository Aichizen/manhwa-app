<!DOCTYPE html>
<html lang="id">

<head>

    <script>
        const pageParams = new URLSearchParams(location.search);
        const launchParams = new URLSearchParams(location.hash.replace(/^#/, ""));
        const launchedFromTelegram = /Telegram/i.test(navigator.userAgent)
            || pageParams.has("tgWebAppPlatform")
            || launchParams.has("tgWebAppPlatform");
        if (launchedFromTelegram && pageParams.get("view") !== "mobile") {
            pageParams.set("view", "mobile");
            history.replaceState(null, "", `${location.pathname}?${pageParams.toString()}${location.hash}`);
        }
        const isTelegramView = pageParams.get("view") === "mobile";
        document.documentElement.classList.add(isTelegramView ? "telegram-view" : "browser-view");
    </script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chapter</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="account.js"></script>


    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        body.reader-body {
            padding-top: 82px;
            overflow-x: hidden;
        }

        .reader-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 82px;
            z-index: 99999;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: rgba(15, 18, 40, .98);
            box-shadow: 0 4px 18px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .reader-back {
            flex: 0 0 50px;
            width: 50px;
            height: 50px;
            margin-right: 13px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3b4168;
            color: #fff;
            cursor: pointer;
        }

        .reader-back svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-title-area {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #readerMangaTitle {
            color: #aaa9bd;
            font-size: 12px;
            line-height: 1.1;
            letter-spacing: 1.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #readerTitle {
            margin: 2px 0 0;
            color: #f5f3fa;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            line-height: 1.05;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reader-comment-toggle {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            margin-left: 8px;
            padding: 9px;
            border: 1px solid rgba(212,177,255,.45);
            border-radius: 12px;
            background: #292d50;
            color: #eadbff;
            cursor: pointer;
        }
        .reader-comment-toggle svg { display:block; width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .reader-mode-toggle { flex:0 0 auto; margin-left:8px; padding:10px 12px; border:1px solid rgba(212,177,255,.45); border-radius:12px; background:#292d50; color:#eadbff; font:600 12px system-ui,sans-serif; cursor:pointer; white-space:nowrap; }
        @media (min-width:701px) { .reader-comment-toggle { display:none !important; } }
        .reader-chapter-nav { display:none; width:min(100% - 32px, 760px); margin:24px auto 32px; gap:16px; justify-content:space-between; }
        .reader-chapter-nav.is-visible { display:flex; }
        .reader-chapter-nav button { min-width:110px; padding:13px 20px; border:1px solid rgba(212,177,255,.45); border-radius:12px; background:#292d50; color:#f4f2fa; font:600 15px system-ui,sans-serif; cursor:pointer; }
        .reader-chapter-nav button:disabled { opacity:.4; cursor:default; }
        .reader-chapter-nav span { align-self:center; color:#aaa9bd; font:13px system-ui,sans-serif; }

        .reader-comment-panel {
            position: fixed;
            top: 82px;
            left: 0;
            right: 0;
            z-index: 99998;
            max-height: min(68vh, 520px);
            overflow: auto;
            padding: 16px;
            background: rgba(18, 21, 43, .98);
            border-bottom: 1px solid rgba(212,177,255,.35);
            box-shadow: 0 12px 28px rgba(0,0,0,.5);
            color: #f4f2fa;
        }

        .reader-comment-panel[hidden] { display: none; }
        .reader-comment-heading { margin: 0 0 10px; font: 600 18px Georgia, serif; }
        .reader-comment-account { margin: 0 0 10px; color: #bcb9cc; font-size: 13px; }
        .reader-comment-account a { color: #d4b1ff; }
        .reader-comment-field { display: block; margin: 12px 0 6px; font-size: 13px; color: #d2cfe0; }
        .reader-comment-input {
            display: block;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 10px;
            background: #0d1022;
            color: #fff;
            font: 15px/1.5 system-ui, sans-serif;
        }
        textarea.reader-comment-input { min-height: 110px; resize: vertical; }
        .reader-comment-submit {
            margin-top: 12px;
            padding: 11px 16px;
            border: 0;
            border-radius: 10px;
            background: #d4b1ff;
            color: #20182b;
            font: 700 14px system-ui, sans-serif;
        }
        .reader-comment-submit:disabled { opacity: .6; }
        .reader-comment-message { min-height: 20px; margin: 10px 0 0; color: #bcb9cc; font-size: 13px; }
        .reader-comment-message.error { color: #ff9c9c; }
        .reader-comment-message.success { color: #95e0ad; }

        #pdf-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            line-height: 0;
            font-size: 0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        #pdf-container .pdf-page {
            display: block;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            line-height: 0;
            font-size: 0;
        }

        #pdf-container canvas {
            display: block;
            width: 100% !important;
            max-width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .reader-loading {
            position: fixed;
            top: 82px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #aaa9bd;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            margin-bottom: 14px;
            border: 3px solid #444;
            border-top-color: #fff;
            border-radius: 50%;
            animation: reader-spin .8s linear infinite;
        }

        @keyframes reader-spin {
            to { transform: rotate(360deg); }
        }

        .reader-error {
            min-height: 300px;
            box-sizing: border-box;
            padding: 30px 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #000;
            color: #aaa9bd;
        }

        @media (max-width: 480px) {
            body.reader-body {
                padding-top: 82px;
            }

            .reader-header {
                height: 82px;
                padding: 10px 14px;
            }

            .reader-back {
                flex-basis: 48px;
                width: 48px;
                height: 48px;
                margin-right: 12px;
            }

            #readerTitle {
                font-size: 22px;
            }

            #readerMangaTitle {
                font-size: 11px;
            }
        }

        .browser-view .reader-header { height:82px; padding:10px 16px; }
        .browser-view .reader-back { flex-basis:50px; width:50px; height:50px; margin-right:13px; }
        .browser-view #readerTitle { font-size:24px; }
        .browser-view #readerMangaTitle { font-size:12px; }

        @media (min-width:701px) {
            .telegram-view body.reader-body { width:100%; max-width:480px; margin:0 auto; padding-top:82px; }
            .telegram-view .reader-header { left:50%; right:auto; width:min(100%,480px); height:82px; padding:10px 14px; transform:translateX(-50%); }
            .telegram-view .reader-back { flex-basis:48px; width:48px; height:48px; margin-right:12px; }
            .telegram-view #readerTitle { font-size:22px; }
            .telegram-view #readerMangaTitle { font-size:11px; }
            .telegram-view #pdf-container { max-width:480px; margin:0 auto; }
            .telegram-view .reader-loading { left:max(0px,calc((100vw - 480px)/2)); right:max(0px,calc((100vw - 480px)/2)); }
        }
    </style>

</head>


<body class="reader-body">


    <!-- HEADER READER -->

    <header class="reader-header">

        <button
            class="reader-back"
            onclick="goBack()"
            aria-label="Kembali"
        >

            <svg viewBox="0 0 24 24">

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

        </button>


        <div class="reader-title-area">

            <span id="readerMangaTitle">
                STORY ABOUT US
            </span>

            <h1 id="readerTitle">
                Chapter 1
            </h1>

        </div>

        <button id="readerModeToggle" class="reader-mode-toggle" type="button" aria-label="Ganti mode baca">Mode: Scroll</button>
        <button id="readerCommentToggle" class="reader-comment-toggle" type="button" aria-label="Komentar" title="Komentar" aria-expanded="false" aria-controls="readerCommentPanel" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5A7.5 7.5 0 1 1 20 11.5Z"></path></svg></button>

    </header>

    <section id="readerCommentPanel" class="reader-comment-panel" aria-label="Komentar chapter" hidden>
        <h2 class="reader-comment-heading">Komentar chapter ini</h2>
        <p id="readerCommentAccount" class="reader-comment-account"><span id="readerCommentAccountText"></span></p>
        <form id="readerCommentForm">
            <label class="reader-comment-field" for="readerCommentText">Komentar</label>
            <textarea id="readerCommentText" class="reader-comment-input" maxlength="1000" placeholder="Tulis komentar tentang chapter ini..." required></textarea>
            <button id="readerCommentSubmit" class="reader-comment-submit" type="submit">Kirim komentar</button>
            <p id="readerCommentMessage" class="reader-comment-message" role="status" aria-live="polite"></p>
        </form>
    </section>



    <!-- LOADING -->

    <div
        id="loading"
        class="reader-loading"
    >

        <div class="loading-spinner"></div>

        <p>Loading chapter...</p>

    </div>



    <!-- ERROR -->

    <div
        id="error"
        class="reader-error"
        style="display: none;"
    >

        <div class="error-icon">
            !
        </div>

        <h2>Chapter tidak dapat dibuka</h2>

        <p id="errorMessage">
            Terjadi kesalahan saat memuat PDF.
        </p>

        <button
            onclick="location.reload()"
            class="retry-button"
        >
            Coba Lagi
        </button>

    </div>



    <!-- PDF -->

    <main id="pdf-container"></main>
    <nav id="readerChapterNav" class="reader-chapter-nav" aria-label="Navigasi chapter">
        <button id="readerPreviousChapter" type="button" aria-label="Chapter sebelumnya">&lt;</button>
        <span id="readerChapterNavLabel">Navigasi chapter</span>
        <button id="readerNextChapter" type="button" aria-label="Chapter berikutnya">&gt;</button>
    </nav>



    <!-- PDF.JS -->

    <script type="module">

        import * as pdfjsLib from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



        /* ==========================================
           TELEGRAM
        ========================================== */

        const tg = window.Telegram?.WebApp;

        tg?.ready();
        tg?.expand();



        /* ==========================================
           AMBIL PARAMETER URL
        ========================================== */

        const params =
            new URLSearchParams(window.location.search);


        const title =
            params.get("title");

        // ID dipakai untuk API dan chapter; nama tampil diambil dari metadata terbaru.
        let mangaDisplayTitle = title || "";


        const chapter =
            params.get("chapter");



        /* ==========================================
           API
        ========================================== */

        const API_BASE =
            "";

        let chapters = [];
        let currentChapterIndex = -1;
        let isLoadingChapter = false;
        let resumePage = Math.max(1, Number(params.get("page") || 1));
        let progressSaveTimer = null;
        let pageRenderObserver = null;
        let activePdfDocument = null;
        let pendingPageRenders = new Set();
        let renderingPage = false;
        const commentToggle = document.getElementById("readerCommentToggle");
        const commentPanel = document.getElementById("readerCommentPanel");
        const commentForm = document.getElementById("readerCommentForm");
        const commentText = document.getElementById("readerCommentText");
        const commentSubmit = document.getElementById("readerCommentSubmit");
        const commentMessage = document.getElementById("readerCommentMessage");
        const commentAccountText = document.getElementById("readerCommentAccountText");
        const readerModeToggle = document.getElementById("readerModeToggle");
        const readerChapterNav = document.getElementById("readerChapterNav");
        const readerChapterNavLabel = document.getElementById("readerChapterNavLabel");
        const readerPreviousChapter = document.getElementById("readerPreviousChapter");
        const readerNextChapter = document.getElementById("readerNextChapter");
        let readerMode = "scroll";

        function readerModeStorageKey() {
            const userId = ReaderAccount.user?.id;
            return userId ? `storyAboutUsReaderMode:${userId}` : "";
        }

        function paintReaderMode() {
            readerModeToggle.textContent = readerMode === "scroll" ? "Mode: Scroll" : "Mode: Chapter";
            readerModeToggle.setAttribute("aria-label", `Mode baca ${readerMode === "scroll" ? "scroll" : "per chapter"}; klik untuk berganti`);
            readerChapterNav.classList.toggle("is-visible", readerMode === "chapter" && currentChapterIndex >= 0);
            readerChapterNavLabel.textContent = `Chapter ${currentChapterIndex + 1} dari ${chapters.length}`;
            readerPreviousChapter.disabled = currentChapterIndex <= 0 || isLoadingChapter;
            readerNextChapter.disabled = currentChapterIndex < 0 || currentChapterIndex >= chapters.length - 1 || isLoadingChapter;
        }

        function setReaderMode(mode, persist = true) {
            readerMode = mode === "chapter" ? "chapter" : "scroll";
            paintReaderMode();
            if (persist) {
                const key = readerModeStorageKey();
                if (key) localStorage.setItem(key, readerMode);
            }
        }

        readerModeToggle.addEventListener("click", () => setReaderMode(readerMode === "scroll" ? "chapter" : "scroll"));
        readerPreviousChapter.addEventListener("click", () => navigateChapter(-1));
        readerNextChapter.addEventListener("click", () => navigateChapter(1));
        commentToggle.addEventListener("click", async () => {
            if (!ReaderAccount.authenticated) {
                if (!ReaderAccount.hasTelegramData) return;
                commentToggle.disabled = true;
                commentMessage.className = "reader-comment-message";
                commentMessage.textContent = "Menghubungkan login Telegram...";
                commentPanel.hidden = false;
                commentToggle.setAttribute("aria-expanded", "true");
                try {
                    await ReaderAccount.login();
                    paintReaderCommentAccount();
                    const savedMode = readerModeStorageKey() ? localStorage.getItem(readerModeStorageKey()) : null;
                    setReaderMode(savedMode === "chapter" ? "chapter" : readerMode, !savedMode);
                    commentMessage.className = "reader-comment-message";
                    commentMessage.textContent = "";
                    commentText.focus();
                } catch (error) {
                    commentMessage.className = "reader-comment-message error";
                    commentMessage.textContent = error.message || "Login Telegram gagal.";
                } finally {
                    commentToggle.disabled = false;
                }
                return;
            }
            const opening = commentPanel.hidden;
            commentPanel.hidden = !opening;
            commentToggle.setAttribute("aria-expanded", String(opening));
            if (opening) commentText.focus();
        });

        function paintReaderCommentAccount() {
            const loggedIn = ReaderAccount.authenticated;
            const displayName = [ReaderAccount.user?.first_name, ReaderAccount.user?.last_name].filter(Boolean).join(" ") || ReaderAccount.user?.username || "akun Telegram";
            const isMobileReader = document.documentElement.classList.contains("telegram-view") || window.matchMedia("(max-width: 700px)").matches;
            commentToggle.hidden = !isMobileReader || (!loggedIn && !ReaderAccount.hasTelegramData);
            commentAccountText.textContent = loggedIn ? `Komentar sebagai ${displayName}.` : "Login Telegram diperlukan untuk mengirim komentar dari reader.";
            if (!loggedIn) {
                commentPanel.hidden = true;
                commentToggle.setAttribute("aria-expanded", "false");
            }
        }

        commentForm.addEventListener("submit", async event => {
            event.preventDefault();
            const text = commentText.value.trim();
            if (!ReaderAccount.authenticated) {
                commentMessage.className = "reader-comment-message error";
                commentMessage.textContent = "Login Telegram diperlukan untuk mengirim komentar dari reader.";
                return;
            }
            if (!text) {
                commentMessage.className = "reader-comment-message error";
                commentMessage.textContent = "Tulis komentar terlebih dahulu.";
                return;
            }
            const currentChapter = chapters[currentChapterIndex];
            if (!currentChapter) {
                commentMessage.className = "reader-comment-message error";
                commentMessage.textContent = "Data chapter belum siap.";
                return;
            }
            commentSubmit.disabled = true;
            commentSubmit.textContent = "Mengirim...";
            commentMessage.className = "reader-comment-message";
            commentMessage.textContent = "";
            try {
                const response = await ReaderAccount.apiFetch(`${API_BASE}/api/comments`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        manga_id: title,
                        username: "",
                        rating: 0,
                        text,
                        chapter_number: Number(currentChapter.number),
                    }),
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) throw new Error(result.error || "Komentar gagal dikirim.");
                commentText.value = "";
                commentMessage.className = "reader-comment-message success";
                commentMessage.textContent = "Komentar terkirim dan akan muncul di daftar komentar judul.";
            } catch (error) {
                commentMessage.className = "reader-comment-message error";
                commentMessage.textContent = error.message || "Komentar gagal dikirim.";
            } finally {
                commentSubmit.disabled = false;
                commentSubmit.textContent = "Kirim komentar";
            }
        });


        /* ==========================================
           CEK DATA
        ========================================== */

        if (!title) {

            showError("Judul manga tidak ditemukan.");

        } else if (!chapter) {

            showError("Nomor chapter tidak ditemukan.");

        } else {

            startReader();

        }


        /* ==========================================
           MULAI READER
        ========================================== */

        async function startReader() {

            try {
                await ReaderAccount.init();
                paintReaderCommentAccount();
                const savedMode = readerModeStorageKey() ? localStorage.getItem(readerModeStorageKey()) : null;
                setReaderMode(savedMode === "chapter" ? "chapter" : "scroll", false);

                const chapterNumber =
                    parseFloat(chapter);


                if (
                    !Number.isFinite(chapterNumber) ||
                    chapterNumber < 0
                ) {

                    throw new Error(
                        "Nomor chapter tidak valid."
                    );

                }


                /* ================================
                   AMBIL DAFTAR CHAPTER DARI API
                ================================= */

                const response = await fetchWithRetry(
                    API_BASE + "/api/manga/" + encodeURIComponent(title),
                    { cache: "no-store" }
                );


                if (!response.ok) {

                    throw new Error(
                        "Daftar chapter tidak dapat dimuat."
                    );

                }


                const mangaData = await response.json();
                if (!Array.isArray(mangaData) && typeof mangaData.title === "string" && mangaData.title.trim()) {
                    mangaDisplayTitle = mangaData.title.trim();
                }
                chapters = Array.isArray(mangaData)
                    ? mangaData
                    : (Array.isArray(mangaData.chapters) ? mangaData.chapters : []);


                if (!Array.isArray(chapters) || !chapters.length) {

                    throw new Error(
                        "Chapter tidak ditemukan."
                    );

                }


                chapters.sort(
                    (a, b) =>
                        Number(a.number || 0) -
                        Number(b.number || 0)
                );


                currentChapterIndex =
                    chapters.findIndex(
                        item =>
                            Number(item.number) ===
                            chapterNumber
                    );


                if (currentChapterIndex === -1) {

                    throw new Error(
                        "Chapter " +
                        chapterNumber +
                        " tidak ditemukan."
                    );

                }

                paintReaderMode();


                updateHeader(
                    chapterNumber
                );


                await loadCurrentChapter();


                window.addEventListener(
                    "scroll",
                    handleScroll,
                    { passive: true }
                );


            } catch (error) {

                console.error(error);

                showError(
                    error.message ||
                    "PDF gagal dimuat."
                );

            }

        }


        /* ==========================================
           HEADER
        ========================================== */

        function updateHeader(chapterNumber) {
            const chapterItem = chapters.find(item => Number(item.number) === Number(chapterNumber));
            const displayChapter = chapterItem?.label || String(chapterNumber).split(".")[0];

            document.title =
                mangaDisplayTitle +
                " - Chapter " +
                displayChapter;


            document.getElementById(
                "readerMangaTitle"
            ).textContent =
                mangaDisplayTitle;


            document.getElementById(
                "readerTitle"
            ).textContent =
                "Chapter " +
                displayChapter;

        }


        /* ==========================================
           LOAD CURRENT CHAPTER
        ========================================== */

        async function loadCurrentChapter() {

            if (isLoadingChapter) {
                return;
            }

            isLoadingChapter = true;


            const item =
                chapters[currentChapterIndex];


            if (!item) {

                isLoadingChapter = false;

                throw new Error(
                    "Data chapter tidak ditemukan."
                );

            }


            let pdfUrl =
                item.url ||
                item.pdf ||
                item.file;


            if (!pdfUrl && item.key) {

                pdfUrl =
                    "https://cdn.storyabout-us.com/" +
                    item.key;

            }


            if (!pdfUrl) {

                throw new Error(
                    "Alamat PDF chapter tidak ditemukan."
                );

            }


            console.log(
                "PDF URL:",
                pdfUrl
            );


            updateHeader(
                Number(item.number)
            );
            paintReaderMode();


            window.scrollTo({
                top: 0,
                behavior: "auto"
            });


            try {

                await loadPDF(pdfUrl);
                if (resumePage > 1) {
                    const pageNode = [...document.querySelectorAll(".pdf-page")].find(node => Number(node.dataset.page) === resumePage);
                    if (pageNode) pageNode.scrollIntoView({ behavior: "auto", block: "start" });
                }
                resumePage = 1;
                saveVisibleProgress();

            } finally {

                isLoadingChapter = false;
                paintReaderMode();

            }

        }


        /* ==========================================
           DETEKSI AKHIR CHAPTER
        ========================================== */

        let bottomTimer = null;

        function handleScroll() {

            if (isLoadingChapter) {
                return;
            }

            scheduleProgressSave();

            if (readerMode === "chapter") return;


            if (bottomTimer) {
                return;
            }


            const distanceFromBottom =
                document.documentElement.scrollHeight -
                (
                    window.scrollY +
                    window.innerHeight
                );


            if (distanceFromBottom <= 160) {

                bottomTimer =
                    setTimeout(
                        async () => {

                            bottomTimer = null;

                            await handleChapterEnd();

                        },
                        250
                    );

            }

        }


        /* ==========================================
           NEXT CHAPTER
        ========================================== */

        function scheduleProgressSave() {
            if (!ReaderAccount.authenticated) return;
            clearTimeout(progressSaveTimer);
            progressSaveTimer = setTimeout(saveVisibleProgress, 900);
        }

        async function saveVisibleProgress() {
            if (!ReaderAccount.authenticated || currentChapterIndex < 0) return;
            const marker = window.scrollY + window.innerHeight * 0.35;
            const pages = [...document.querySelectorAll(".pdf-page[data-page]")];
            let pageNumber = 1;
            for (const node of pages) {
                if (node.getBoundingClientRect().top + window.scrollY <= marker) pageNumber = Number(node.dataset.page) || pageNumber;
                else break;
            }
            const current = chapters[currentChapterIndex];
            try {
                await ReaderAccount.apiFetch("/api/history", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ manga_id: title, chapter_number: Number(current.number), page_number: pageNumber })
                });
            } catch (error) { console.warn("Reading progress was not saved:", error); }
        }

        async function handleChapterEnd() {

            if (isLoadingChapter) {
                return;
            }


            const nextIndex =
                currentChapterIndex + 1;


            if (
                nextIndex <
                chapters.length
            ) {

                currentChapterIndex =
                    nextIndex;


                const nextChapter =
                    chapters[
                        currentChapterIndex
                    ];


                updateHeader(
                    Number(nextChapter.number)
                );


                await loadCurrentChapter();


            } else {

                backToChapters();

            }

        }

        async function navigateChapter(offset) {
            const nextIndex = currentChapterIndex + offset;
            if (isLoadingChapter || nextIndex < 0 || nextIndex >= chapters.length) return;
            currentChapterIndex = nextIndex;
            resumePage = 1;
            paintReaderMode();
            await loadCurrentChapter();
        }


        /* ==========================================
           KEMBALI KE DAFTAR CHAPTER
        ========================================== */

        function backToChapters() {
            const isMobileView = new URLSearchParams(location.search).get("view") === "mobile";
            const viewParam = isMobileView ? "&view=mobile" : "";

            if (!title) {
                window.location.href = "index.html" + (isMobileView ? "?view=mobile" : "");
                return;
            }

            window.location.href = "chapter.html?title=" + encodeURIComponent(title) + viewParam;
        }

        window.goBack =
            backToChapters;



        /* ==========================================
           LOAD PDF.JS
        ========================================== */

        async function fetchWithRetry(url, options = {}, maxAttempts = 3) {
            let lastError;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok || response.status < 500 || attempt === maxAttempts - 1) return response;
                    lastError = new Error(`Server sementara tidak tersedia (${response.status}).`);
                } catch (error) {
                    lastError = error;
                    if (attempt === maxAttempts - 1) break;
                }
                await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
            }
            throw lastError || new Error("Koneksi gagal.");
        }

        async function openPdfWithRetry(pdfUrl, maxAttempts = 3) {
            let lastError;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                let loadingTask;
                try {
                    loadingTask = pdfjsLib.getDocument({
                        url: pdfUrl,
                        withCredentials: false,
                        disableAutoFetch: true,
                        rangeChunkSize: 256 * 1024,
                    });
                    return await loadingTask.promise;
                } catch (error) {
                    lastError = error;
                    try { await loadingTask?.destroy(); } catch {}
                    if (attempt < maxAttempts - 1) {
                        const loading = document.getElementById("loading");
                        loading.querySelector("p").textContent = `Koneksi terputus, mencoba lagi (${attempt + 2}/${maxAttempts})...`;
                        await new Promise(resolve => setTimeout(resolve, 700 * (attempt + 1)));
                    }
                }
            }
            throw new Error(`PDF gagal dimuat setelah ${maxAttempts} percobaan. ${lastError?.message || "Periksa koneksi lalu muat ulang."}`);
        }

        async function loadPDF(pdfUrl) {

            const container =
                document.getElementById(
                    "pdf-container"
                );


            container.innerHTML = "";
            if (pageRenderObserver) pageRenderObserver.disconnect();
            pageRenderObserver = null;
            pendingPageRenders = new Set();
            activePdfDocument = null;
            renderingPage = false;
            const loading = document.getElementById("loading");
            loading.style.display = "flex";
            loading.querySelector("p").textContent = "Memuat halaman pertama...";


            try {

                const pdf = await openPdfWithRetry(pdfUrl);
                activePdfDocument = pdf;


                console.log(
                    "Jumlah halaman:",
                    pdf.numPages
                );


                const firstPage = await pdf.getPage(1);
                const firstViewport = firstPage.getViewport({ scale: 1 });
                const pageRatio = firstViewport.width / firstViewport.height;
                const pageSlots = [];

                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const slot = document.createElement("div");
                    slot.className = "pdf-page";
                    slot.dataset.page = String(pageNumber);
                    slot.dataset.rendered = "false";
                    slot.style.aspectRatio = String(pageRatio);
                    container.appendChild(slot);
                    pageSlots.push(slot);
                }

                await renderPage(pdf, 1, container, pageSlots[0], firstPage);
                hideLoading();

                if ("IntersectionObserver" in window) {
                    pageRenderObserver = new IntersectionObserver(entries => {
                        for (const entry of entries) {
                            if (!entry.isIntersecting) continue;
                            const pageNumber = Number(entry.target.dataset.page);
                            if (entry.target.dataset.rendered === "false") pendingPageRenders.add(pageNumber);
                        }
                        renderPendingPages(pageSlots);
                    }, { rootMargin: "1200px 0px", threshold: 0 });
                    pageSlots.slice(1).forEach(slot => pageRenderObserver.observe(slot));
                } else {
                    pageSlots.slice(1).forEach(slot => pendingPageRenders.add(Number(slot.dataset.page)));
                    renderPendingPages(pageSlots);
                }


            } catch (error) {

                console.error(
                    "PDF.js error:",
                    error
                );


                throw new Error(
                    "PDF tidak dapat dimuat. Periksa koneksi internet atau alamat PDF."
                );

            }

        }



        /* ==========================================
           RENDER SATU HALAMAN
        ========================================== */

        async function renderPage(
            pdf,
            pageNumber,
            container,
            pageWrapper,
            suppliedPage
        ) {

            const page = suppliedPage || await pdf.getPage(pageNumber);


            /* ==============================
               SKALA

               Kita render lebih besar supaya
               gambar tetap tajam di HP.
            ============================== */

            const baseViewport =
                page.getViewport({
                    scale: 1
                });


            const screenWidth =
                container.clientWidth;


            const pixelRatio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            const scale =
                (screenWidth * pixelRatio) /
                baseViewport.width;


            const viewport =
                page.getViewport({
                    scale: scale
                });



            /* ==============================
               WRAPPER HALAMAN
            ============================== */

            /* ==============================
               CANVAS
            ============================== */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            canvas.style.width =
                "100%";


            canvas.style.height =
                "auto";



            pageWrapper.replaceChildren(canvas);
            pageWrapper.dataset.rendered = "true";
            pageWrapper.style.aspectRatio = "auto";



            /* ==============================
               RENDER
            ============================== */

            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }

        async function renderPendingPages(pageSlots) {
            if (renderingPage || !activePdfDocument) return;
            renderingPage = true;
            try {
                while (pendingPageRenders.size) {
                    const pageNumber = Math.min(...pendingPageRenders);
                    pendingPageRenders.delete(pageNumber);
                    const slot = pageSlots[pageNumber - 1];
                    if (!slot || slot.dataset.rendered !== "false") continue;
                    await renderPage(activePdfDocument, pageNumber, document.getElementById("pdf-container"), slot);
                }
            } catch (error) {
                console.error("PDF page render failed:", error);
                showError("Sebagian halaman PDF tidak dapat dirender. Muat ulang reader untuk mencoba lagi.");
            } finally {
                renderingPage = false;
            }
        }



        /* ==========================================
           HIDE LOADING
        ========================================== */

        function hideLoading() {

            const loading =
                document.getElementById(
                    "loading"
                );


            loading.style.display =
                "none";

        }



        /* ==========================================
           ERROR
        ========================================== */

        /* ==========================================
           VIEWER-ONLY UI DETERRENTS
        ========================================== */

        document.addEventListener(
            "contextmenu",
            event => event.preventDefault()
        );


        document.addEventListener(
            "dragstart",
            event => {

                if (
                    event.target.closest(
                        "#pdf-container, .reader-header"
                    )
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "selectstart",
            event => {

                if (
                    event.target.closest(
                        "#pdf-container"
                    )
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                const key =
                    event.key.toLowerCase();

                if (
                    (event.ctrlKey || event.metaKey) &&
                    (key === "s" || key === "p")
                ) {

                    event.preventDefault();

                }

            }
        );


        /* ==========================================
           ERROR
        ========================================== */

        function showError(message) {

            const loading =
                document.getElementById(
                    "loading"
                );


            const error =
                document.getElementById(
                    "error"
                );


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            loading.style.display =
                "none";


            error.style.display =
                "flex";


            errorMessage.textContent =
                message;

        }

    </script>
