<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chapter</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================================
           READER - self contained so reader.html works even if
           reader CSS has not yet been added to style.css
        ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }

        body.reader-body {
            padding-top: 82px;
            color: #fff;
            overflow-x: hidden;
        }

        .reader-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 82px;
            z-index: 99999;

            display: flex;
            align-items: center;

            box-sizing: border-box;
            padding: 10px 16px;

            background: rgba(15, 18, 40, 0.98);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .reader-back {
            flex-shrink: 0;

            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 13px;
            padding: 0;

            border: none;
            border-radius: 50%;

            background: #3b4168;
            color: #fff;

            cursor: pointer;
            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .reader-back:hover {
            background: #4b527e;
        }

        .reader-back:active {
            transform: scale(0.90);
        }

        .reader-back svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-title-area {
            min-width: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .reader-manga-title {
            color: #aaa9bd;
            font-size: 12px;
            line-height: 1.1;
            letter-spacing: 1.2px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reader-title {
            margin: 2px 0 0;

            color: #f5f3fa;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            line-height: 1.05;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #pdf-container {
            width: 100%;
            margin: 0;
            padding: 0;

            background: #000;

            overflow: hidden;

            line-height: 0;
            font-size: 0;
        }

        #pdf-container .pdf-page {
            display: block;

            width: 100%;
            margin: 0;
            padding: 0;

            border: 0;

            line-height: 0;
            font-size: 0;
        }

        #pdf-container .pdf-page + .pdf-page {
            margin-top: -1px;
        }

        #pdf-container canvas {
            display: block;

            width: 100%;
            height: auto;

            margin: 0;
            padding: 0;

            border: 0;

            line-height: 0;
            font-size: 0;

            -webkit-user-select: none;
            user-select: none;

            -webkit-user-drag: none;
            user-drag: none;

            -webkit-touch-callout: none;
        }

        .reader-loading {
            position: fixed;

            top: 82px;
            left: 0;
            right: 0;
            bottom: 0;

            z-index: 1000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #000;
            color: #aaa9bd;

            text-align: center;
        }

        .loading-spinner {
            width: 34px;
            height: 34px;

            margin-bottom: 14px;

            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #aaa9bd;
            border-radius: 50%;

            animation: readerSpin 0.8s linear infinite;
        }

        @keyframes readerSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .reader-loading p {
            margin: 0;
            font-size: 14px;
        }

        .reader-error {
            min-height: 300px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;

            padding: 40px 24px;

            background: #000;
            color: #aaa9bd;

            text-align: center;
        }

        .error-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 14px;

            border: 2px solid #aaa9bd;
            border-radius: 50%;

            font-size: 24px;
            font-weight: 700;
        }

        .reader-error h2 {
            margin: 0 0 8px;
            color: #fff;
            font-size: 18px;
        }

        .reader-error p {
            max-width: 420px;
            margin: 0 0 18px;
            line-height: 1.5;
            font-size: 14px;
        }

        .retry-button {
            padding: 10px 18px;

            border: none;
            border-radius: 10px;

            background: #3b4168;
            color: #fff;

            cursor: pointer;
            font-size: 14px;
        }

        .retry-button:active {
            transform: scale(0.97);
        }

        @media (max-width: 480px) {
            body.reader-body {
                padding-top: 82px;
            }

            .reader-header {
                height: 82px;
                padding: 10px 16px;
            }

            .reader-back {
                width: 48px;
                height: 48px;
                margin-right: 12px;
            }

            .reader-back svg {
                width: 27px;
                height: 27px;
            }

            .reader-manga-title {
                font-size: 11px;
            }

            .reader-title {
                font-size: 23px;
            }
        }
    </style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>


<body class="reader-body">

    <!-- HEADER READER -->
    <header class="reader-header">

        <button
            id="readerBack"
            class="reader-back"
            type="button"
            aria-label="Kembali"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>

        <div class="reader-title-area">

            <span
                id="readerMangaTitle"
                class="reader-manga-title"
            >
                STORY ABOUT US
            </span>

            <h1
                id="readerTitle"
                class="reader-title"
            >
                Chapter
            </h1>

        </div>

    </header>


    <!-- LOADING -->
    <div
        id="loading"
        class="reader-loading"
    >
        <div class="loading-spinner"></div>
        <p id="loadingText">Loading chapter...</p>
    </div>


    <!-- ERROR -->
    <div
        id="error"
        class="reader-error"
        style="display: none;"
    >

        <div class="error-icon">!</div>

        <h2>Chapter tidak dapat dibuka</h2>

        <p id="errorMessage">
            Terjadi kesalahan saat memuat PDF.
        </p>

        <button
            id="retryButton"
            type="button"
            class="retry-button"
        >
            Coba Lagi
        </button>

    </div>


    <!-- PDF -->
    <main id="pdf-container"></main>


    <!-- PDF.JS -->
    <script type="module">

        import * as pdfjsLib from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        /* =========================================================
           KONFIGURASI
        ========================================================= */

        const API_BASE =
            "https://story-about-us-api.aichinose219.workers.dev";

        const CDN_BASE =
            "https://cdn.storyabout-us.com";


        /* =========================================================
           TELEGRAM
        ========================================================= */

        const tg =
            window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        /* =========================================================
           PARAMETER URL

           reader.html?title=dash&chapter=1
           reader.html?title=dash
        ========================================================= */

        const params =
            new URLSearchParams(window.location.search);

        const title =
            params.get("title");

        const requestedChapter =
            params.get("chapter");


        /* =========================================================
           ELEMENT
        ========================================================= */

        const readerMangaTitle =
            document.getElementById("readerMangaTitle");

        const readerTitle =
            document.getElementById("readerTitle");

        const pdfContainer =
            document.getElementById("pdf-container");

        const loading =
            document.getElementById("loading");

        const loadingText =
            document.getElementById("loadingText");

        const errorBox =
            document.getElementById("error");

        const errorMessage =
            document.getElementById("errorMessage");

        const retryButton =
            document.getElementById("retryButton");

        const readerBack =
            document.getElementById("readerBack");


        /* =========================================================
           STATE
        ========================================================= */

        let chapters = [];
        let currentChapterIndex = -1;

        let isLoadingChapter = false;
        let bottomTimer = null;
        let scrollListenerAttached = false;


        /* =========================================================
           BACK BUTTON

           Selalu kembali ke daftar chapter manga ini.
        ========================================================= */

        function backToChapters() {

            if (!title) {
                window.location.href = "index.html";
                return;
            }

            window.location.href =
                "chapter.html?title=" +
                encodeURIComponent(title);
        }

        readerBack.addEventListener(
            "click",
            backToChapters
        );


        /* =========================================================
           RETRY
        ========================================================= */

        retryButton.addEventListener(
            "click",
            () => {
                startReader();
            }
        );


        /* =========================================================
           VALIDASI ID MANGA
        ========================================================= */

        function validMangaId(id) {

            return /^[a-zA-Z0-9_-]+$/.test(id || "");

        }


        /* =========================================================
           FORMAT JUDUL DARI ID

           evil-deed -> Evil Deed
        ========================================================= */

        function formatTitle(id) {

            return String(id || "")
                .split("-")
                .map(word => {
                    if (!word) return "";
                    return (
                        word.charAt(0).toUpperCase() +
                        word.slice(1)
                    );
                })
                .join(" ");

        }


        /* =========================================================
           FORMAT CHAPTER

           Mendukung:
           1
           01
           1.5
           001
        ========================================================= */

        function getChapterNumber(item) {

            if (item && Number.isFinite(Number(item.number))) {
                return Number(item.number);
            }

            const value =
                item?.chapter ??
                item?.name ??
                item?.filename ??
                "";

            const match =
                String(value).match(
                    /(\d+(?:\.\d+)?)/
                );

            return match
                ? Number(match[1])
                : 0;

        }


        /* =========================================================
           GET CHAPTER LABEL
        ========================================================= */

        function getChapterLabel(item) {

            if (item?.chapter !== undefined) {

                return String(item.chapter)
                    .replace(/\.pdf$/i, "");

            }

            const number =
                getChapterNumber(item);

            return String(number);
        }


        /* =========================================================
           GET PDF URL

           Prioritas:
           1. url dari API
           2. pdf
           3. file
           4. key -> CDN

           Ini membuat reader tetap kompatibel jika API
           mengembalikan field yang sedikit berbeda.
        ========================================================= */

        function getPdfUrl(item) {

            if (item?.url) {
                return item.url;
            }

            if (item?.pdf) {
                return item.pdf;
            }

            if (item?.file) {
                return item.file;
            }

            if (item?.key) {
                return (
                    CDN_BASE +
                    "/" +
                    String(item.key)
                        .split("/")
                        .map(encodeURIComponent)
                        .join("/")
                );
            }

            return null;
        }


        /* =========================================================
           FETCH CHAPTER DARI API
        ========================================================= */

        async function fetchChapters() {

            const response =
                await fetch(
                    API_BASE +
                    "/api/manga/" +
                    encodeURIComponent(title),
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "Gagal mengambil daftar chapter. (" +
                    response.status +
                    ")"
                );

            }

            const data =
                await response.json();

            if (!Array.isArray(data)) {

                throw new Error(
                    "Data chapter dari API tidak valid."
                );

            }

            return data
                .filter(item => getPdfUrl(item))
                .sort(
                    (a, b) =>
                        getChapterNumber(a) -
                        getChapterNumber(b)
                );

        }


        /* =========================================================
           TENTUKAN CHAPTER AWAL

           Jika URL:
           ?chapter=5

           maka mulai chapter 5.

           Jika tidak ada:
           mulai chapter terkecil.
        ========================================================= */

        function findStartingChapterIndex() {

            if (!chapters.length) {
                return -1;
            }

            if (
                requestedChapter !== null &&
                requestedChapter !== ""
            ) {

                const requestedNumber =
                    Number(requestedChapter);

                if (Number.isFinite(requestedNumber)) {

                    const exactIndex =
                        chapters.findIndex(
                            item =>
                                getChapterNumber(item) ===
                                requestedNumber
                        );

                    if (exactIndex !== -1) {
                        return exactIndex;
                    }
                }

                const requestedText =
                    String(requestedChapter)
                        .replace(/\.pdf$/i, "")
                        .trim()
                        .toLowerCase();

                const textIndex =
                    chapters.findIndex(
                        item =>
                            getChapterLabel(item)
                                .toLowerCase() ===
                            requestedText
                    );

                if (textIndex !== -1) {
                    return textIndex;
                }
            }

            return 0;
        }


        /* =========================================================
           UPDATE HEADER
        ========================================================= */

        function updateHeader() {

            const item =
                chapters[currentChapterIndex];

            if (!item) {
                return;
            }

            const chapterLabel =
                getChapterLabel(item);

            const mangaName =
                formatTitle(title);

            readerMangaTitle.textContent =
                mangaName;

            readerTitle.textContent =
                "Chapter " +
                chapterLabel;

            document.title =
                mangaName +
                " - Chapter " +
                chapterLabel;
        }


        /* =========================================================
           MULAI READER
        ========================================================= */

        async function startReader() {

            if (!validMangaId(title)) {

                showError(
                    "Manga tidak ditemukan."
                );

                return;
            }

            try {

                showLoading(
                    "Loading chapter..."
                );

                hideError();

                const mangaName =
                    formatTitle(title);

                readerMangaTitle.textContent =
                    mangaName;

                readerTitle.textContent =
                    "Loading...";


                chapters =
                    await fetchChapters();


                if (!chapters.length) {

                    throw new Error(
                        "Belum ada chapter yang tersedia untuk manga ini."
                    );

                }


                currentChapterIndex =
                    findStartingChapterIndex();


                if (currentChapterIndex < 0) {

                    throw new Error(
                        "Chapter tidak ditemukan."
                    );

                }


                attachScrollListener();

                await loadCurrentChapter();

            } catch (error) {

                console.error(
                    "Reader error:",
                    error
                );

                showError(
                    error.message ||
                    "Chapter gagal dimuat."
                );

            }

        }


        /* =========================================================
           LOAD CHAPTER AKTIF
        ========================================================= */

        async function loadCurrentChapter() {

            if (isLoadingChapter) {
                return;
            }

            const item =
                chapters[currentChapterIndex];

            if (!item) {
                return;
            }

            const pdfUrl =
                getPdfUrl(item);

            if (!pdfUrl) {

                throw new Error(
                    "Alamat PDF chapter tidak ditemukan."
                );

            }

            isLoadingChapter = true;

            try {

                updateHeader();

                showLoading(
                    "Loading Chapter " +
                    getChapterLabel(item) +
                    "..."
                );

                hideError();

                pdfContainer.innerHTML = "";

                window.scrollTo({
                    top: 0,
                    behavior: "auto"
                });

                await loadPDF(pdfUrl);

                hideLoading();

            } catch (error) {

                console.error(
                    "PDF error:",
                    error
                );

                showError(
                    "PDF tidak dapat dimuat. Periksa koneksi internet atau alamat PDF."
                );

                throw error;

            } finally {

                isLoadingChapter = false;

            }

        }


        /* =========================================================
           LOAD PDF.JS
        ========================================================= */

        async function loadPDF(pdfUrl) {

            const loadingTask =
                pdfjsLib.getDocument({
                    url: pdfUrl,
                    withCredentials: false
                });

            const pdf =
                await loadingTask.promise;

            console.log(
                "Chapter:",
                getChapterLabel(
                    chapters[currentChapterIndex]
                ),
                "| Halaman:",
                pdf.numPages
            );


            for (
                let pageNumber = 1;
                pageNumber <= pdf.numPages;
                pageNumber++
            ) {

                await renderPage(
                    pdf,
                    pageNumber,
                    pdfContainer
                );

            }

        }


        /* =========================================================
           RENDER SATU HALAMAN

           Render 2x agar lebih tajam di HP.
        ========================================================= */

        async function renderPage(
            pdf,
            pageNumber,
            container
        ) {

            const page =
                await pdf.getPage(
                    pageNumber
                );


            const baseViewport =
                page.getViewport({
                    scale: 1
                });


            const screenWidth =
                Math.max(
                    window.innerWidth,
                    320
                );


            const scale =
                (screenWidth * 2) /
                baseViewport.width;


            const viewport =
                page.getViewport({
                    scale: scale
                });


            const pageWrapper =
                document.createElement("div");

            pageWrapper.className =
                "pdf-page";


            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d", {
                    alpha: false
                });


            canvas.width =
                Math.ceil(viewport.width);

            canvas.height =
                Math.ceil(viewport.height);

            canvas.style.width =
                "100%";

            canvas.style.height =
                "auto";


            pageWrapper.appendChild(
                canvas
            );

            container.appendChild(
                pageWrapper
            );


            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }


        /* =========================================================
           AUTO NEXT CHAPTER

           Jika user sampai bawah chapter:
           - masih ada chapter -> buka berikutnya
           - sudah chapter terakhir -> kembali ke chapter.html
        ========================================================= */

        function attachScrollListener() {

            if (scrollListenerAttached) {
                return;
            }

            window.addEventListener(
                "scroll",
                handleScroll,
                {
                    passive: true
                }
            );

            scrollListenerAttached = true;

        }


        function handleScroll() {

            if (isLoadingChapter) {
                return;
            }

            if (
                currentChapterIndex < 0 ||
                !chapters.length
            ) {
                return;
            }

            clearTimeout(bottomTimer);

            bottomTimer =
                setTimeout(
                    checkChapterBottom,
                    120
                );

        }


        function checkChapterBottom() {

            if (isLoadingChapter) {
                return;
            }

            const scrollPosition =
                window.scrollY +
                window.innerHeight;

            const documentHeight =
                document.documentElement.scrollHeight;

            const distanceFromBottom =
                documentHeight -
                scrollPosition;


            /*
             * 160px dibuat sedikit lebih longgar agar
             * perpindahan chapter terasa otomatis.
             */
            if (distanceFromBottom > 160) {
                return;
            }

            handleChapterEnd();

        }


        async function handleChapterEnd() {

            if (isLoadingChapter) {
                return;
            }

            const nextIndex =
                currentChapterIndex + 1;


            if (
                nextIndex <
                chapters.length
            ) {

                currentChapterIndex =
                    nextIndex;

                await loadCurrentChapter();

                return;
            }


            /*
             * Sudah chapter terakhir.
             */
            backToChapters();

        }


        /* =========================================================
           LOADING UI
        ========================================================= */

        function showLoading(message) {

            loadingText.textContent =
                message || "Loading chapter...";

            loading.style.display =
                "flex";

        }


        function hideLoading() {

            loading.style.display =
                "none";

        }


        /* =========================================================
           ERROR UI
        ========================================================= */

        function showError(message) {

            hideLoading();

            errorMessage.textContent =
                message ||
                "PDF gagal dimuat.";

            errorBox.style.display =
                "flex";

        }


        function hideError() {

            errorBox.style.display =
                "none";

        }


        /* =========================================================
           VIEWER-ONLY DETERRENTS

           Ini hanya mencegah kontrol/UI umum.
           PDF tetap harus dikirim ke browser agar bisa dibaca,
           jadi ini bukan DRM absolut.
        ========================================================= */

        document.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            }
        );


        document.addEventListener(
            "dragstart",
            event => {

                if (
                    event.target.closest(
                        "#pdf-container, .reader-header"
                    )
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "selectstart",
            event => {

                if (
                    event.target.closest(
                        "#pdf-container"
                    )
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                const key =
                    String(event.key || "")
                        .toLowerCase();


                const modifier =
                    event.ctrlKey ||
                    event.metaKey;


                /*
                 * Ctrl/Cmd + S
                 */
                if (
                    modifier &&
                    key === "s"
                ) {

                    event.preventDefault();
                    event.stopPropagation();

                    return;
                }


                /*
                 * Ctrl/Cmd + P
                 */
                if (
                    modifier &&
                    key === "p"
                ) {

                    event.preventDefault();
                    event.stopPropagation();

                    return;
                }


                /*
                 * Print Screen
                 */
                if (
                    event.key === "PrintScreen"
                ) {

                    event.preventDefault();

                    return;
                }

            },
            true
        );


        /* =========================================================
           MULAI
        ========================================================= */

        startReader();

    </script>

</body>
</html>
