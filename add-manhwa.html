<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Manhwa | Story About Us</title>
  <style>
    :root { color-scheme:dark; --text:#f4f2fa; --muted:#bbb7cc; --accent:#d4b1ff; --line:rgba(255,255,255,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(rgba(10,10,28,.4),rgba(10,10,28,.62)),url("homepage-bg.png") center/cover fixed; }
    main { width:min(100%,680px); margin:auto; }
    a { color:inherit; text-decoration:none; }
    .back { display:inline-block; margin-bottom:22px; color:var(--muted); }
    .panel { padding:clamp(22px,5vw,38px); border:1px solid var(--line); border-radius:20px; background:rgba(24,22,42,.88); backdrop-filter:blur(10px); }
    h1 { margin:0 0 6px; font:clamp(28px,5vw,36px)/1.15 Georgia,"Times New Roman",serif; }
    .intro { margin:0 0 24px; color:var(--muted); }
    label { display:block; margin:18px 0 7px; font-weight:650; }
    input,textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:rgba(10,11,22,.76); color:var(--text); font:inherit; }
    input[type=file] { padding:10px; } textarea { min-height:125px; resize:vertical; }
    .hint { margin:5px 0 0; color:var(--muted); font-size:13px; }
    button { width:100%; margin-top:24px; padding:13px 18px; border:0; border-radius:10px; background:var(--accent); color:#20182b; font:700 16px system-ui,sans-serif; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:24px; margin:16px 0 0; color:var(--muted); white-space:pre-wrap; }
    #status.error { color:#ff9c9c; } #status.success { color:#95e0ad; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="admin.html">← Back to Admin</a>
    <section class="panel">
      <h1>Add Manhwa</h1>
      <p class="intro">ID dibuat otomatis dari title. Isi judul, cover, dan deskripsi manhwa.</p>
      <form id="addMangaForm">
        <label for="adminToken">Admin token</label>
        <input id="adminToken" name="adminToken" type="password" autocomplete="off" required>
        <p class="hint">Gunakan secret <code>ADMIN_TOKEN</code> yang disetel di Cloudflare Worker.</p>

        <label for="title">Judul</label>
        <input id="title" name="title" maxlength="120" required>

        <label for="summary">Deskripsi <span class="hint">(opsional)</span></label>
        <textarea id="summary" name="summary" maxlength="5000" placeholder="Tulis ringkasan cerita jika tersedia..."></textarea>

        <label for="cover">Cover</label>
        <input id="cover" name="cover" type="file" accept="image/jpeg,image/png,image/webp" required>
        <p class="hint">JPG, PNG, atau WebP; maksimal 8 MB.</p>

        <button id="submitButton" type="submit">TAMBAH MANHWA</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const API_BASE = "https://story-about-us-api.aichinose219.workers.dev";
    const form = document.getElementById("addMangaForm");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    function formatBroadcastStatus(broadcast) {
      if (!broadcast) return "Status broadcast tidak tersedia.";
      if (!broadcast.configured) return `Broadcast tidak terkirim: ${broadcast.error || "konfigurasi bot belum tersedia."}`;
      if (broadcast.total === 0) return "Broadcast belum dikirim: belum ada pengguna yang pernah menekan /start.";
      if (broadcast.failed > 0) return `Broadcast sebagian gagal: ${broadcast.sent}/${broadcast.total} terkirim, ${broadcast.failed} gagal.${broadcast.error ? ` ${broadcast.error}` : ""}`;
      return `Broadcast berhasil: ${broadcast.sent}/${broadcast.total} terkirim.`;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      statusEl.className = "";
      statusEl.textContent = "Menyimpan manhwa...";
      submitButton.disabled = true;
      try {
        const formData = new FormData(form);
        const token = formData.get("adminToken");
        formData.delete("adminToken");
        const response = await fetch(`${API_BASE}/api/admin/manga`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `Permintaan gagal (${response.status}).`);
        statusEl.className = result.broadcast?.ok ? "success" : "error";
        statusEl.textContent = `${result.title || "Manhwa"} berhasil ditambahkan. ${formatBroadcastStatus(result.broadcast)}`;
        form.reset();
      } catch (error) {
        statusEl.className = "error";
        statusEl.textContent = error.message || "Tidak dapat menghubungi API.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
