<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Story About Us</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            background: #0c1024;
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            color: #f4f2fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                linear-gradient(
                    180deg,
                    rgba(10, 13, 30, 0.25),
                    rgba(10, 13, 30, 0.90)
                ),

                url("https://cdn.storyabout-us.com/Theme/homepage-bg.png");

            background-size: cover;

            background-position:
                center top;

            background-repeat: no-repeat;

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            padding:
                20px 18px 70px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            display: flex;

            align-items: flex-start;

            gap: 18px;

            margin-bottom: 28px;
        }


        .back-button {

            flex-shrink: 0;

            width: 56px;
            height: 56px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background:
                rgba(66, 72, 113, .72);

            color: white;

            font-size: 38px;

            line-height: 1;

            cursor: pointer;

            backdrop-filter: blur(12px);

            transition:
                transform .15s ease;
        }


        .back-button:active {

            transform:
                scale(.90);
        }


        .header-info {

            padding-top: 3px;

            min-width: 0;
        }


        .site-name {

            color: #a9a7c4;

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 5px;
        }


        .manga-title-header {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(28px, 7vw, 42px);

            line-height: 1.05;

            color: #f5f2fa;

            overflow-wrap: anywhere;
        }


        /* =====================================================
           MANGA INFO
        ===================================================== */

        .manga-info {

            margin-bottom: 30px;
        }


        .cover {

            width: 172px;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;

            border-radius: 20px;

            border:
                1px solid
                rgba(190, 195, 230, .18);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,.35);

            background: #292e4c;
        }


        .main-title {

            margin-top: 20px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 32px;

            line-height: 1.1;

            color: #f4f1f8;

            overflow-wrap: anywhere;
        }


        .description {

            margin-top: 8px;

            color: #a3a4bd;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =====================================================
           CHAPTER HEADER
        ===================================================== */

        .chapter-heading-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 16px;
        }


        .chapter-heading {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 28px;

            color: #f3eff8;
        }


        /* =====================================================
           SORT BUTTON
        ===================================================== */

        .sort-button {

            flex-shrink: 0;

            min-width: 92px;

            height: 40px;

            padding:
                0 13px;

            border:
                1px solid
                rgba(184, 173, 225, .25);

            border-radius: 12px;

            background:
                rgba(55, 61, 96, .78);

            color: #ddd7ee;

            font-size: 13px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                background .15s ease,
                transform .15s ease;
        }


        .sort-button:active {

            transform:
                scale(.94);
        }


        /* =====================================================
           CHAPTER LIST
        ===================================================== */

        .chapter-list {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .chapter-button {

            width: 100%;

            min-height: 76px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 18px;

            border:
                1px solid
                rgba(166, 174, 216, .18);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(47, 53, 84, .90),
                    rgba(37, 42, 69, .92)
                );

            color: #f2eff7;

            cursor: pointer;

            box-shadow:
                0 8px 22px
                rgba(0,0,0,.16);

            transition:
                transform .15s ease,
                background .15s ease;
        }


        .chapter-button:hover {

            background:
                linear-gradient(
                    145deg,
                    rgba(58, 64, 99, .94),
                    rgba(42, 48, 78, .94)
                );
        }


        .chapter-button:active {

            transform:
                scale(.985);
        }


        .chapter-number {

            font-size: 16px;

            letter-spacing: .4px;
        }


        .chapter-arrow {

            color: #c8a7ff;

            font-size: 34px;

            font-weight: 300;

            line-height: 1;
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading {

            padding:
                50px 10px;

            color: #8e92ad;

            text-align: center;
        }


        .error {

            padding:
                40px 10px;

            color: #9a9eb8;

            text-align: center;

            display: none;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            height: 1px;

            margin:
                42px 0 34px;

            background:
                rgba(168, 173, 207, .14);
        }


        /* =====================================================
           COMMENTS
        ===================================================== */

        .comments-section {

            margin-top: 10px;
        }


        .comments-title {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 28px;

            margin-bottom: 7px;
        }


        .comments-subtitle {

            color: #858aa5;

            font-size: 14px;

            margin-bottom: 20px;
        }


        /* =====================================================
           COMMENT FORM
        ===================================================== */

        .comment-form {

            padding: 18px;

            border:
                1px solid
                rgba(170, 177, 216, .17);

            border-radius: 20px;

            background:
                rgba(31, 36, 63, .78);

            backdrop-filter: blur(14px);
        }


        .input-label {

            display: block;

            margin-bottom: 7px;

            color: #b7b8ca;

            font-size: 13px;
        }


        .name-input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border:
                1px solid
                rgba(160, 167, 204, .20);

            border-radius: 12px;

            outline: none;

            background:
                rgba(17, 21, 42, .65);

            color: white;

            font-size: 15px;
        }


        .name-input::placeholder {

            color: #686d87;
        }


        .name-input:focus {

            border-color:
                rgba(191, 157, 246, .48);
        }


        /* =====================================================
           RATING
        ===================================================== */

        .rating-box {

            margin-top: 17px;
        }


        .stars {

            display: flex;

            gap: 5px;
        }


        .star {

            width: 35px;
            height: 35px;

            padding: 0;

            border: none;

            background: transparent;

            color: #565b75;

            font-size: 27px;

            line-height: 1;

            cursor: pointer;
        }


        .star.selected,
        .star.hovered {

            color: #d2a8ff;
        }


        /* =====================================================
           COMMENT TEXT
        ===================================================== */

        .comment-box {

            margin-top: 17px;
        }


        .comment-input {

            width: 100%;

            min-height: 110px;

            padding:
                13px 14px;

            resize: vertical;

            border:
                1px solid
                rgba(160, 167, 204, .20);

            border-radius: 12px;

            outline: none;

            background:
                rgba(17, 21, 42, .65);

            color: white;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.5;
        }


        .comment-input::placeholder {

            color: #686d87;
        }


        .comment-input:focus {

            border-color:
                rgba(191, 157, 246, .48);
        }


        /* =====================================================
           SUBMIT
        ===================================================== */

        .submit-comment {

            width: 100%;

            height: 48px;

            margin-top: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #8972b5,
                    #65538f
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .submit-comment:active {

            transform:
                scale(.98);
        }


        .submit-comment:disabled {

            opacity: .55;

            cursor: wait;
        }


        /* =====================================================
           COMMENT LIST
        ===================================================== */

        .comment-list {

            display: flex;

            flex-direction: column;

            gap: 13px;

            margin-top: 22px;
        }


        .comment-card {

            padding: 16px;

            border:
                1px solid
                rgba(165, 171, 208, .14);

            border-radius: 17px;

            background:
                rgba(29, 34, 60, .75);

            backdrop-filter: blur(10px);
        }


        .comment-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 8px;
        }


        .comment-name {

            color: #eeeaf6;

            font-weight: 600;

            font-size: 15px;

            overflow-wrap: anywhere;
        }


        .comment-rating {

            color: #c9a2ff;

            font-size: 14px;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        .comment-text {

            color: #b2b4c8;

            font-size: 14px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .comment-date {

            margin-top: 9px;

            color: #62677f;

            font-size: 11px;
        }


        .no-comments {

            padding:
                25px 10px;

            color: #747991;

            text-align: center;

            font-size: 14px;
        }


        /* =====================================================
           COMMENT MESSAGE
        ===================================================== */

        .comment-message {

            display: none;

            margin-top: 12px;

            padding: 10px 12px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.4;
        }


        .comment-message.show {

            display: block;
        }


        .comment-message.success {

            color: #bce8ca;

            background:
                rgba(62, 130, 81, .18);
        }


        .comment-message.error {

            color: #efb8c0;

            background:
                rgba(150, 58, 72, .18);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .container {

                padding:
                    18px 14px 55px;
            }


            .header {

                gap: 14px;

                margin-bottom: 25px;
            }


            .back-button {

                width: 54px;
                height: 54px;
            }


            .manga-title-header {

                font-size: 29px;
            }


            .cover {

                width: 172px;

                border-radius: 18px;
            }


            .main-title {

                font-size: 30px;
            }


            .chapter-heading {

                font-size: 26px;
            }


            .chapter-button {

                min-height: 74px;

                border-radius: 18px;
            }


            .comment-form {

                padding: 15px;
            }


            .comment-header {

                align-items: flex-start;

                flex-direction: column;

                gap: 5px;
            }
        }

    </style>

</head>


<body>


    <main class="container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <button
                class="back-button"
                onclick="goBack()"
                aria-label="Back"
            >
                ‹
            </button>


            <div class="header-info">

                <div class="site-name">
                    STORY ABOUT US
                </div>


                <h1
                    id="headerTitle"
                    class="manga-title-header"
                >
                    Loading...
                </h1>

            </div>

        </header>


        <!-- =================================================
             MANGA INFO
        ================================================== -->

        <section class="manga-info">

            <img
                id="cover"
                class="cover"
                src="https://cdn.storyabout-us.com/Theme/homepage-bg.png"
                alt="Manga cover"
            >


            <h2
                id="mainTitle"
                class="main-title"
            >
                Loading...
            </h2>


            <p
                id="description"
                class="description"
            >
                Choose a chapter and continue the story.
            </p>

        </section>


        <!-- =================================================
             CHAPTERS
        ================================================== -->

        <section>

            <div class="chapter-heading-row">

                <h2 class="chapter-heading">
                    Chapters
                </h2>


                <button
                    id="sortButton"
                    class="sort-button"
                    type="button"
                >
                    A → Z
                </button>

            </div>


            <div
                id="chapterList"
                class="chapter-list"
            >

                <div
                    id="loading"
                    class="loading"
                >
                    Loading chapters...
                </div>

            </div>


            <div
                id="error"
                class="error"
            >
                Unable to load chapters.
            </div>

        </section>


        <!-- =================================================
             DIVIDER
        ================================================== -->

        <div class="divider"></div>


        <!-- =================================================
             COMMENTS
        ================================================== -->

        <section
            class="comments-section"
        >

            <h2 class="comments-title">
                Comments
            </h2>


            <p class="comments-subtitle">
                Share your thoughts about this story.
            </p>


            <!-- COMMENT FORM -->

            <form
                id="commentForm"
                class="comment-form"
            >

                <label
                    class="input-label"
                    for="nameInput"
                >
                    Name
                </label>


                <input
                    id="nameInput"
                    class="name-input"
                    type="text"
                    maxlength="30"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                >


                <!-- RATING -->

                <div class="rating-box">

                    <span class="input-label">
                        Rating
                    </span>


                    <div
                        id="stars"
                        class="stars"
                    >

                        <button
                            type="button"
                            class="star"
                            data-rating="1"
                            aria-label="1 star"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="2"
                            aria-label="2 stars"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="3"
                            aria-label="3 stars"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="4"
                            aria-label="4 stars"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="5"
                            aria-label="5 stars"
                        >
                            ☆
                        </button>

                    </div>

                </div>


                <!-- COMMENT -->

                <div class="comment-box">

                    <label
                        class="input-label"
                        for="commentInput"
                    >
                        Comment
                    </label>


                    <textarea
                        id="commentInput"
                        class="comment-input"
                        maxlength="1000"
                        placeholder="Write your comment..."
                        required
                    ></textarea>

                </div>


                <button
                    id="submitComment"
                    type="submit"
                    class="submit-comment"
                >
                    Post Comment
                </button>


                <div
                    id="commentMessage"
                    class="comment-message"
                ></div>

            </form>


            <!-- COMMENT LIST -->

            <div
                id="commentList"
                class="comment-list"
            >

                <div class="no-comments">
                    Loading comments...
                </div>

            </div>

        </section>


    </main>


    <script>

        /* =====================================================
           TELEGRAM
        ===================================================== */

        const tg =
            window.Telegram?.WebApp;


        if (tg) {

            tg.ready();

            tg.expand();
        }


        /* =====================================================
           API
        ===================================================== */

        const API_BASE =
            "https://story-about-us-api.aichinose219.workers.dev";


        /* =====================================================
           MANGA ID
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const mangaId =
            params.get("title");


        if (!mangaId) {

            window.location.href =
                "index.html";
        }


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const headerTitle =
            document.getElementById(
                "headerTitle"
            );


        const mainTitle =
            document.getElementById(
                "mainTitle"
            );


        const cover =
            document.getElementById(
                "cover"
            );


        const chapterList =
            document.getElementById(
                "chapterList"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const error =
            document.getElementById(
                "error"
            );


        const sortButton =
            document.getElementById(
                "sortButton"
            );


        const commentForm =
            document.getElementById(
                "commentForm"
            );


        const nameInput =
            document.getElementById(
                "nameInput"
            );


        const commentInput =
            document.getElementById(
                "commentInput"
            );


        const commentList =
            document.getElementById(
                "commentList"
            );


        const submitComment =
            document.getElementById(
                "submitComment"
            );


        const commentMessage =
            document.getElementById(
                "commentMessage"
            );


        const stars =
            document.querySelectorAll(
                ".star"
            );


        /* =====================================================
           VARIABLES
        ===================================================== */

        let chapters = [];

        let ascending = true;

        let selectedRating = 0;


        /* =====================================================
           FORMAT TITLE
        ===================================================== */

        function formatTitle(id) {

            return id
                .split("-")
                .map(
                    word =>
                        word.charAt(0).toUpperCase() +
                        word.slice(1)
                )
                .join(" ");
        }


        /* =====================================================
           BACK
        ===================================================== */

        function goBack() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "index.html";
            }
        }


        /* =====================================================
           LOAD MANGA INFO
        ===================================================== */

        async function loadMangaInfo() {

            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/manga"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Manga API failed"
                    );
                }


                const data =
                    await response.json();


                const manga =
                    data.find(
                        item =>
                            item.id === mangaId
                    );


                if (!manga) {

                    throw new Error(
                        "Manga not found"
                    );
                }


                const title =
                    manga.title ||
                    formatTitle(
                        manga.id
                    );


                headerTitle.textContent =
                    title;


                mainTitle.textContent =
                    title;


                if (manga.cover) {

                    cover.src =
                        manga.cover;
                }


                cover.alt =
                    title;


                document.title =
                    title +
                    " - Story About Us";


            } catch (err) {

                console.error(
                    err
                );


                const title =
                    formatTitle(
                        mangaId
                    );


                headerTitle.textContent =
                    title;


                mainTitle.textContent =
                    title;
            }
        }


        /* =====================================================
           LOAD CHAPTERS
        ===================================================== */

        async function loadChapters() {

            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/manga/" +
                        encodeURIComponent(
                            mangaId
                        )
                    );


                if (!response.ok) {

                    throw new Error(
                        "Chapter API failed"
                    );
                }


                const data =
                    await response.json();


                if (Array.isArray(data)) {

                    chapters =
                        data;

                } else if (
                    Array.isArray(
                        data.chapters
                    )
                ) {

                    chapters =
                        data.chapters;

                } else {

                    chapters = [];
                }


                loading.style.display =
                    "none";


                renderChapters();


            } catch (err) {

                console.error(
                    err
                );


                loading.style.display =
                    "none";


                error.style.display =
                    "block";
            }
        }


        /* =====================================================
           CHAPTER NUMBER
        ===================================================== */

        function getChapterNumber(
            chapter
        ) {

            const value =

                typeof chapter === "string"

                    ? chapter

                    : (
                        chapter.chapter ||
                        chapter.number ||
                        chapter.name ||
                        chapter.key ||
                        ""
                    );


            const match =
                String(value).match(
                    /(\d+(?:\.\d+)?)/
                );


            return match
                ? Number(
                    match[1]
                )
                : 0;
        }


        /* =====================================================
           CHAPTER LABEL
        ===================================================== */

        function getChapterLabel(
            chapter
        ) {

            if (
                typeof chapter === "string"
            ) {

                return chapter
                    .replace(
                        /\.pdf$/i,
                        ""
                    )
                    .replace(
                        /^.*\//,
                        ""
                    );
            }


            return (

                chapter.label ||

                chapter.chapter ||

                chapter.number ||

                chapter.name ||

                "Chapter"
            );
        }


        /* =====================================================
           CHAPTER URL
        ===================================================== */

        function getChapterUrl(
            chapter
        ) {

            /*
             * Prioritas:
             * URL dari API.
             */

            if (
                typeof chapter === "object"
            ) {

                if (chapter.url) {

                    return chapter.url;
                }


                if (chapter.pdf) {

                    return chapter.pdf;
                }


                if (chapter.file) {

                    return chapter.file;
                }
            }


            /*
             * Fallback CDN
             */

            const number =
                getChapterNumber(
                    chapter
                );


            const padded =
                String(
                    number
                ).padStart(
                    3,
                    "0"
                );


            return (

                "https://cdn.storyabout-us.com/pdf/" +

                encodeURIComponent(
                    mangaId
                ) +

                "/" +

                padded +

                ".pdf"
            );
        }


        /* =====================================================
           RENDER CHAPTERS
        ===================================================== */

        function renderChapters() {

            chapterList.innerHTML =
                "";


            if (
                chapters.length === 0
            ) {

                chapterList.innerHTML =
                    `
                    <div class="loading">
                        No chapters found.
                    </div>
                    `;

                return;
            }


            const sorted =
                [...chapters].sort(
                    (a, b) => {

                        const numberA =
                            getChapterNumber(
                                a
                            );


                        const numberB =
                            getChapterNumber(
                                b
                            );


                        return ascending

                            ? numberA - numberB

                            : numberB - numberA;
                    }
                );


            sorted.forEach(
                chapter => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "chapter-button";


                    const label =
                        getChapterLabel(
                            chapter
                        );


                    button.innerHTML =

                        `
                        <span class="chapter-number">
                            CHAPTER ${label}
                        </span>

                        <span class="chapter-arrow">
                            ›
                        </span>
                        `;


                    /*
                     * Buka READER, bukan PDF langsung.
                     *
                     * Reader akan mengambil PDF dari API/CDN
                     * dan menangani perpindahan chapter otomatis.
                     */

                    const chapterNumber =
                        getChapterNumber(
                            chapter
                        );


                    button.onclick =
                        () => {

                            if (!chapterNumber) {
                                return;
                            }


                            window.location.href =
                                "reader.html?title=" +
                                encodeURIComponent(mangaId) +
                                "&chapter=" +
                                encodeURIComponent(
                                    chapterNumber
                                );

                        };


                    chapterList.appendChild(
                        button
                    );
                }
            );
        }


        /* =====================================================
           SORT CHAPTER
        ===================================================== */

        sortButton.addEventListener(
            "click",
            function () {

                ascending =
                    !ascending;


                this.textContent =
                    ascending
                        ? "A → Z"
                        : "Z → A";


                renderChapters();
            }
        );


        /* =====================================================
           STARS
        ===================================================== */

        stars.forEach(
            star => {

                star.addEventListener(
                    "mouseenter",
                    function () {

                        highlightStars(
                            Number(
                                this.dataset.rating
                            )
                        );
                    }
                );


                star.addEventListener(
                    "mouseleave",
                    function () {

                        highlightStars(
                            selectedRating
                        );
                    }
                );


                star.addEventListener(
                    "click",
                    function () {

                        selectedRating =
                            Number(
                                this.dataset.rating
                            );


                        highlightStars(
                            selectedRating
                        );
                    }
                );
            }
        );


        function highlightStars(
            rating
        ) {

            stars.forEach(
                star => {

                    const value =
                        Number(
                            star.dataset.rating
                        );


                    if (
                        value <= rating
                    ) {

                        star.textContent =
                            "★";

                        star.classList.add(
                            "selected"
                        );

                    } else {

                        star.textContent =
                            "☆";

                        star.classList.remove(
                            "selected"
                        );
                    }
                }
            );
        }


        /* =====================================================
           SHOW COMMENT MESSAGE
        ===================================================== */

        function showCommentMessage(
            message,
            type
        ) {

            commentMessage.textContent =
                message;


            commentMessage.className =
                "comment-message show " +
                type;


            setTimeout(
                () => {

                    commentMessage.className =
                        "comment-message";

                },
                4000
            );
        }


        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDate(
            timestamp
        ) {

            if (!timestamp) {

                return "";
            }


            const date =
                new Date(
                    timestamp
                );


            return date.toLocaleDateString(
                "id-ID",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );
        }


        /* =====================================================
           LOAD COMMENTS FROM D1
        ===================================================== */

        async function loadComments() {

            commentList.innerHTML =
                `
                <div class="no-comments">
                    Loading comments...
                </div>
                `;


            try {

                const response =
                    await fetch(

                        API_BASE +

                        "/api/comments/" +

                        encodeURIComponent(
                            mangaId
                        )
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load comments"
                    );
                }


                const data =
                    await response.json();


                const comments =
                    Array.isArray(
                        data.comments
                    )
                        ? data.comments
                        : [];


                renderComments(
                    comments
                );


            } catch (err) {

                console.error(
                    err
                );


                commentList.innerHTML =
                    `
                    <div class="no-comments">
                        Unable to load comments.
                    </div>
                    `;
            }
        }


        /* =====================================================
           RENDER COMMENTS
        ===================================================== */

        function renderComments(
            comments
        ) {

            commentList.innerHTML =
                "";


            if (
                comments.length === 0
            ) {

                commentList.innerHTML =
                    `
                    <div class="no-comments">
                        No comments yet.
                        Be the first to share your thoughts.
                    </div>
                    `;

                return;
            }


            comments.forEach(
                comment => {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "comment-card";


                    /* HEADER */

                    const header =
                        document.createElement(
                            "div"
                        );


                    header.className =
                        "comment-header";


                    /* NAME */

                    const name =
                        document.createElement(
                            "span"
                        );


                    name.className =
                        "comment-name";


                    name.textContent =
                        comment.name;


                    /* RATING */

                    const rating =
                        document.createElement(
                            "span"
                        );


                    rating.className =
                        "comment-rating";


                    const ratingNumber =
                        Number(
                            comment.rating
                        );


                    rating.textContent =

                        "★".repeat(
                            ratingNumber
                        ) +

                        "☆".repeat(
                            5 -
                            ratingNumber
                        );


                    header.appendChild(
                        name
                    );


                    header.appendChild(
                        rating
                    );


                    /* TEXT */

                    const text =
                        document.createElement(
                            "div"
                        );


                    text.className =
                        "comment-text";


                    text.textContent =
                        comment.comment ||
                        "";


                    /* DATE */

                    const date =
                        document.createElement(
                            "div"
                        );


                    date.className =
                        "comment-date";


                    date.textContent =
                        formatDate(
                            comment.created_at
                        );


                    card.appendChild(
                        header
                    );


                    card.appendChild(
                        text
                    );


                    if (
                        comment.created_at
                    ) {

                        card.appendChild(
                            date
                        );
                    }


                    commentList.appendChild(
                        card
                    );
                }
            );
        }


        /* =====================================================
           SUBMIT COMMENT
        ===================================================== */

        commentForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    nameInput.value.trim();


                const comment =
                    commentInput.value.trim();


                /*
                 * Validasi nama
                 */

                if (!name) {

                    showCommentMessage(
                        "Please enter your name.",
                        "error"
                    );

                    return;
                }


                /*
                 * Validasi rating
                 */

                if (
                    selectedRating < 1
                ) {

                    showCommentMessage(
                        "Please select a rating.",
                        "error"
                    );

                    return;
                }


                /*
                 * Validasi komentar
                 */

                if (!comment) {

                    showCommentMessage(
                        "Please write a comment.",
                        "error"
                    );

                    return;
                }


                /*
                 * Loading
                 */

                submitComment.disabled =
                    true;


                submitComment.textContent =
                    "Posting...";


                try {

                    const response =
                        await fetch(

                            API_BASE +
                            "/api/comments",

                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        manga_id:
                                            mangaId,

                                        name:
                                            name,

                                        rating:
                                            selectedRating,

                                        comment:
                                            comment
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.error ||
                            "Failed to post comment"
                        );
                    }


                    /*
                     * Reset form
                     */

                    commentForm.reset();


                    selectedRating =
                        0;


                    highlightStars(
                        0
                    );


                    showCommentMessage(
                        "Comment posted successfully!",
                        "success"
                    );


                    /*
                     * Ambil ulang komentar
                     * dari D1
                     */

                    await loadComments();


                } catch (err) {

                    console.error(
                        err
                    );


                    showCommentMessage(
                        err.message ||
                        "Unable to post comment.",
                        "error"
                    );

                } finally {

                    submitComment.disabled =
                        false;


                    submitComment.textContent =
                        "Post Comment";
                }
            }
        );


        /* =====================================================
           START
        ===================================================== */

        loadMangaInfo();

        loadChapters();

        loadComments();

    </script>

</body>

</html>
