<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapter</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

    <header class="reader-header">

        <button onclick="history.back()">
            ←
        </button>

        <h1 id="titleName">Judul</h1>

        <div></div>

    </header>


    <main class="chapters">

        <h2>Pilihan Chapter</h2>

        <div
            class="chapter-item"
            onclick="openChapter(1)"
        >
            <span>Chapter 1</span>
            <span>›</span>
        </div>

        <div
            class="chapter-item"
            onclick="openChapter(2)"
        >
            <span>Chapter 2</span>
            <span>›</span>
        </div>

        <div
            class="chapter-item"
            onclick="openChapter(3)"
        >
            <span>Chapter 3</span>
            <span>›</span>
        </div>

    </main>


    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        // Membaca judul dari URL
        const params = new URLSearchParams(window.location.search);

        const title = params.get("title");


        // Mengubah nama judul
        const titleNames = {

            "evil-deed": "Evil Deed",

            "semantic-error": "Semantic Error",

            "guiding-hazard": "Guiding Hazard",

            "dash": "Dash"

        };


        document.getElementById("titleName").textContent =
            titleNames[title] || "Judul";


        // Membuka chapter
        function openChapter(chapter) {

            window.location.href =
                "reader.html?title=" +
                title +
                "&chapter=" +
                chapter;

        }

    </script>

</body>

</html>
