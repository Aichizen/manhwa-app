<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Story About Us</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="account.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            background: #0c1024;
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            color: #f4f2fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                linear-gradient(
                    180deg,
                    rgba(10, 13, 30, 0.25),
                    rgba(10, 13, 30, 0.90)
                ),

                url("https://cdn.storyabout-us.com/Theme/homepage-bg.png");

            background-size: cover;

            background-position:
                center top;

            background-repeat: no-repeat;

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            padding:
                20px 18px 70px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            display: flex;

            align-items: flex-start;

            gap: 18px;

            margin-bottom: 28px;
        }


        .back-button {

            flex-shrink: 0;

            width: 56px;
            height: 56px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background:
                rgba(66, 72, 113, .72);

            color: white;

            font-size: 38px;

            line-height: 1;

            cursor: pointer;

            backdrop-filter: blur(12px);

            transition:
                transform .15s ease;
        }


        .back-button:active {

            transform:
                scale(.90);
        }


        .header-info {

            padding-top: 3px;

            min-width: 0;
        }


        .site-name {
            color: #a9a7c4;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }


        .manga-title-header {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(28px, 7vw, 42px);

            line-height: 1.05;

            color: #f5f2fa;

            overflow-wrap: anywhere;
        }


        /* =====================================================
           MANGA INFO
        ===================================================== */

        .manga-info {

            margin-bottom: 30px;
        }


        .cover {

            width: 172px;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;

            border-radius: 20px;

            border:
                1px solid
                rgba(190, 195, 230, .18);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,.35);

            background: #292e4c;
        }


        .main-title {

            margin-top: 20px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 32px;

            line-height: 1.1;

            color: #f4f1f8;

            overflow-wrap: anywhere;
        }


        .rating-summary {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 9px;
            color: #a3a4bd;
            font-size: 13px;
        }

        .rating-stars {
            color: #f3c96b;
            font-size: 17px;
            letter-spacing: 1px;
            line-height: 1;
        }

        .rating-score {
            color: #f4f1f8;
            font-weight: 700;
        }

        .description {

            margin-top: 8px;

            color: #a3a4bd;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =====================================================
           CHAPTER HEADER
        ===================================================== */

        .chapter-heading-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 16px;
        }


        .chapter-heading {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 28px;

            color: #f3eff8;
        }


        /* =====================================================
           SORT BUTTON
        ===================================================== */

        .sort-button {

            flex-shrink: 0;

            min-width: 92px;

            height: 40px;

            padding:
                0 13px;

            border:
                1px solid
                rgba(184, 173, 225, .25);

            border-radius: 12px;

            background:
                rgba(55, 61, 96, .78);

            color: #ddd7ee;

            font-size: 13px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                background .15s ease,
                transform .15s ease;
        }


        .sort-button:active {

            transform:
                scale(.94);
        }


        /* =====================================================
           CHAPTER LIST
        ===================================================== */

        .chapter-list {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .chapter-button {

            width: 100%;

            min-height: 76px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 18px;

            border:
                1px solid
                rgba(166, 174, 216, .18);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(47, 53, 84, .90),
                    rgba(37, 42, 69, .92)
                );

            color: #f2eff7;

            cursor: pointer;

            box-shadow:
                0 8px 22px
                rgba(0,0,0,.16);

            transition:
                transform .15s ease,
                background .15s ease;
        }


        .chapter-button:hover {

            background:
                linear-gradient(
                    145deg,
                    rgba(58, 64, 99, .94),
                    rgba(42, 48, 78, .94)
                );
        }


        .chapter-button:active {

            transform:
                scale(.985);
        }


        .chapter-number {

            font-size: 16px;

            letter-spacing: .4px;
        }


        .chapter-arrow {

            color: #c8a7ff;

            font-size: 34px;

            font-weight: 300;

            line-height: 1;
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading {

            padding:
                50px 10px;

            color: #8e92ad;

            text-align: center;
        }


        .error {

            padding:
                40px 10px;

            color: #9a9eb8;

            text-align: center;

            display: none;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            height: 1px;

            margin:
                42px 0 34px;

            background:
                rgba(168, 173, 207, .14);
        }


        /* =====================================================
           COMMENTS
        ===================================================== */

        .comments-section {

            margin-top: 10px;
        }


        .comments-title {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 28px;

            margin-bottom: 7px;
        }


        .comments-subtitle {

            color: #858aa5;

            font-size: 14px;

            margin-bottom: 20px;
        }


        /* =====================================================
           COMMENT FORM
        ===================================================== */

        .comment-form {

            padding: 18px;

            border:
                1px solid
                rgba(170, 177, 216, .17);

            border-radius: 20px;

            background:
                rgba(31, 36, 63, .78);

            backdrop-filter: blur(14px);
        }


        .input-label {

            display: block;

            margin-bottom: 7px;

            color: #b7b8ca;

            font-size: 13px;
        }


        .name-input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border:
                1px solid
                rgba(160, 167, 204, .20);

            border-radius: 12px;

            outline: none;

            background:
                rgba(17, 21, 42, .65);

            color: white;

            font-size: 15px;
        }


        .name-input::placeholder {

            color: #686d87;
        }


        .name-input:focus {

            border-color:
                rgba(191, 157, 246, .48);
        }


        /* =====================================================
           RATING
        ===================================================== */

        .rating-box {

            margin-top: 17px;
        }


        .stars {

            display: flex;

            gap: 5px;
        }


        .star {

            width: 35px;
            height: 35px;

            padding: 0;

            border: none;

            background: transparent;

            color: #565b75;

            font-size: 27px;

            line-height: 1;

            cursor: pointer;
        }


        .star.selected,
        .star.hovered {

            color: #d2a8ff;
        }


        /* =====================================================
           COMMENT TEXT
        ===================================================== */

        .comment-box {

            margin-top: 17px;
        }


        .comment-input {

            width: 100%;

            min-height: 110px;

            padding:
                13px 14px;

            resize: vertical;

            border:
                1px solid
                rgba(160, 167, 204, .20);

            border-radius: 12px;

            outline: none;

            background:
                rgba(17, 21, 42, .65);

            color: white;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.5;
        }


        .comment-input::placeholder {

            color: #686d87;
        }


        .comment-input:focus {

            border-color:
                rgba(191, 157, 246, .48);
        }


        /* =====================================================
           SUBMIT
        ===================================================== */

        .submit-comment {

            width: 100%;

            height: 82px;

            margin-top: 15px;

            border: none;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #a88bd0,
                    #765c9d
                );

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 21px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .12),
                0 8px 20px rgba(0, 0, 0, .12);
        }


        .submit-comment:active {

            transform:
                scale(.98);
        }


        .submit-comment:disabled {

            opacity: .55;

            cursor: wait;
        }


        /* =====================================================
           COMMENT LIST
        ===================================================== */

        .comment-list {

            display: flex;

            flex-direction: column;

            gap: 13px;

            margin-top: 22px;
        }


        .comment-card {

            padding: 16px;

            border:
                1px solid
                rgba(165, 171, 208, .14);

            border-radius: 17px;

            background:
                rgba(29, 34, 60, .75);

            backdrop-filter: blur(10px);
        }


        .comment-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 8px;
        }


        .comment-name {

            color: #eeeaf6;

            font-weight: 600;

            font-size: 15px;

            overflow-wrap: anywhere;
        }


        .comment-rating {

            color: #c9a2ff;

            font-size: 14px;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        .comment-text {

            color: #b2b4c8;

            font-size: 14px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .comment-date {
            margin-top: 9px;
            color: #62677f;
            font-size: 11px;
        }

        .reply-context[hidden] {
            display: none;
        }

        .reply-context {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(118, 92, 157, .2);
            color: #ddd1f2;
            font-size: 13px;
        }

        .reply-context button,
        .comment-reply-button {
            border: 0;
            border-radius: 8px;
            padding: 7px 11px;
            background: #765c9d;
            color: #fff;
            cursor: pointer;
        }

        .comment-reply-quote {
            margin: 0 0 10px;
            padding: 8px 11px;
            border-left: 3px solid #9d7bc4;
            border-radius: 5px;
            background: rgba(118, 92, 157, .12);
            color: #aaa2bc;
            font-size: 12px;
        }

        .comment-reply-button {
            margin-top: 10px;
            font-size: 12px;
        }

        .no-comments {

            padding:
                25px 10px;

            color: #747991;

            text-align: center;

            font-size: 14px;
        }


        /* =====================================================
           COMMENT MESSAGE
        ===================================================== */

        .comment-message {

            display: none;

            margin-top: 20px;

            padding: 18px 16px;

            border-radius: 20px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;

            line-height: 1.4;

            text-align: center;
        }


        .comment-message.show {

            display: block;
        }


        .comment-message.success {

            color: #bce8ca;

            background:
                rgba(62, 130, 81, .18);
        }


        .comment-message.error {

            color: #efb8c0;

            background:
                rgba(90, 39, 67, .48);
        }


        /* =====================================================
           AD SLOT
        ===================================================== */

        .ad-slot {
            width: 100%;
            min-height: 50px;
            margin: 0 0 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 14px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .container {

                padding:
                    18px 14px 55px;
            }


            .header {

                gap: 14px;

                margin-bottom: 25px;
            }


            .back-button {

                width: 54px;
                height: 54px;
            }


            .manga-title-header {

                font-size: 29px;
            }


            .cover {

                width: 172px;

                border-radius: 18px;
            }


            .main-title {

                font-size: 30px;
            }


            .chapter-heading {

                font-size: 26px;
            }


            .chapter-button {

                min-height: 74px;

                border-radius: 18px;
            }


            .comment-form {

                padding: 15px;
            }


            .comment-header {

                align-items: flex-start;

                flex-direction: column;

                gap: 5px;
            }
        }

    
        .comment-account-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px; color:#a3a4bd; font-size:13px; }
        .comment-account-actions a { color:#c9a2ff; font-weight:600; text-decoration:underline; cursor:pointer; }
    </style>

</head>


<body>


    <main class="container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <button
                class="back-button"
                onclick="goBack()"
                aria-label="Back"
            >
                ‹
            </button>


            <div class="header-info">

                <div class="site-name">
                    STORY ABOUT US
                </div>


                <h1
                    id="headerTitle"
                    class="manga-title-header"
                >
                    Loading...
                </h1>

            </div>

        </header>


        <!-- =================================================
             MANGA INFO
        ================================================== -->

        <section class="manga-info">

            <img
                id="cover"
                class="cover"
                src="https://cdn.storyabout-us.com/Theme/homepage-bg.png"
                alt="Manga cover"
            >


            <h2
                id="mainTitle"
                class="main-title"
            >
                Loading...
            </h2>

            <div class="rating-summary" aria-label="Community rating">
                <span id="ratingStars" class="rating-stars" aria-hidden="true">☆☆☆☆☆</span>
                <span id="ratingScore" class="rating-score">—</span>
                <span id="ratingCount">(No ratings yet)</span>
            </div>


            <p
                id="description"
                class="description"
            >
                Choose a chapter and continue the story.
            </p>

        </section>


        <!-- =================================================
             AD
        ================================================== -->

        <div class="ad-slot" aria-label="Advertisement">
            <script src='//libtl.com/sdk.js' data-zone='12033217' data-sdk='show_12033217'></script>
        </div>


        <!-- =================================================
             CHAPTERS
        ================================================== -->

        <section>

            <div class="chapter-heading-row">

                <h2 class="chapter-heading">
                    Chapters
                </h2>


                <button
                    id="sortButton"
                    class="sort-button"
                    type="button"
                >
                    A → Z
                </button>

            </div>


            <div
                id="chapterList"
                class="chapter-list"
            >

                <div
                    id="loading"
                    class="loading"
                >
                    Loading chapters...
                </div>

            </div>


            <div
                id="error"
                class="error"
            >
                Unable to load chapters.
            </div>

        </section>


        <!-- =================================================
             DIVIDER
        ================================================== -->

        <div class="divider"></div>


        <!-- =================================================
             COMMENTS
        ================================================== -->

        <section
            class="comments-section"
        >

            <h2 class="comments-title">
                Comments
            </h2>


            <p class="comments-subtitle">
                Share your thoughts about this story.
            </p>


            <div class="comment-account-actions"><span id="commentAccountStatus"></span><span id="commentLoginPrompt">Belum login? <a id="commentTelegramLogin" href="#">Klik disini</a>.</span></div>
            <!-- COMMENT FORM -->

            <form
                id="commentForm"
                class="comment-form"
            >

                <div id="nameFieldGroup">
                <label
                    class="input-label"
                    for="nameInput"
                >
                    Name
                </label>


                <input
                    id="nameInput"
                    class="name-input"
                    type="text"
                    maxlength="30"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                >


                </div>

                <!-- RATING -->

                <div class="rating-box">

                    <span class="input-label">
                        Rating
                    </span>


                    <div
                        id="stars"
                        class="stars"
                    >

                        <button
                            type="button"
                            class="star"
                            data-rating="1"
                            aria-label="1 star"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="2"
                            aria-label="2 stars"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="3"
                            aria-label="3 stars"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="4"
                            aria-label="4 stars"
                        >
                            ☆
                        </button>


                        <button
                            type="button"
                            class="star"
                            data-rating="5"
                            aria-label="5 stars"
                        >
                            ☆
                        </button>

                    </div>

                </div>


                <div id="replyContext" class="reply-context" hidden>
                    <span id="replyContextText"></span>
                    <button id="cancelReply" type="button">Batal</button>
                </div>

                <!-- COMMENT -->

                <div class="comment-box">

                    <label
                        class="input-label"
                        for="commentInput"
                    >
                        Comment
                    </label>


                    <textarea
                        id="commentInput"
                        class="comment-input"
                        maxlength="1000"
                        placeholder="Write your comment..."
                        required
                    ></textarea>

                </div>


                <button
                    id="submitComment"
                    type="submit"
                    class="submit-comment"
                >
                    Post Comment
                </button>


                <div
                    id="commentMessage"
                    class="comment-message"
                ></div>

            </form>


            <!-- COMMENT LIST -->

            <div
                id="commentList"
                class="comment-list"
            >

                <div class="no-comments">
                    Loading comments...
                </div>

            </div>

        </section>


    </main>


    <script>

        /* =====================================================
           TELEGRAM
        ===================================================== */

        const tg =
            window.Telegram?.WebApp;


        if (tg) {

            tg.ready();

            tg.expand();
        }


        /* =====================================================
           API
        ===================================================== */

        const API_BASE =
            "https://story-about-us-api.aichinose219.workers.dev";


        /* =====================================================
           MANGA ID
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const mangaId =
            params.get("title");


        if (!mangaId) {

            window.location.href =
                "index.html";
        }


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const headerTitle =
            document.getElementById(
                "headerTitle"
            );


        const mainTitle =
            document.getElementById(
                "mainTitle"
            );


        const cover =
            document.getElementById(
                "cover"
            );


        const chapterList =
            document.getElementById(
                "chapterList"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const error =
            document.getElementById(
                "error"
            );


        const sortButton =
            document.getElementById(
                "sortButton"
            );


        const commentForm =
            document.getElementById(
                "commentForm"
            );


        const nameInput =
            document.getElementById(
                "nameInput"
            );


        const commentInput =
            document.getElementById(
                "commentInput"
            );


        const commentList =
            document.getElementById(
                "commentList"
            );


        const submitComment =
            document.getElementById(
                "submitComment"
            );


        const commentMessage =
            document.getElementById(
                "commentMessage"
            );

        const replyContext = document.getElementById("replyContext");
        const replyContextText = document.getElementById("replyContextText");
        const cancelReplyButton = document.getElementById("cancelReply");
        let replyTargetId = null;

        cancelReplyButton.addEventListener("click", clearReplyTarget);

        function clearReplyTarget() {
            replyTargetId = null;
            replyContext.hidden = true;
            replyContextText.textContent = "";
        }

        const stars =
            document.querySelectorAll(
                ".star"
            );


        /* =====================================================
           VARIABLES
        ===================================================== */

        let chapters = [];

        let ascending = true;

        let selectedRating = 0;


        /* =====================================================
           FORMAT TITLE
        ===================================================== */

        function formatTitle(id) {

            return id
                .split("-")
                .map(
                    word =>
                        word.charAt(0).toUpperCase() +
                        word.slice(1)
                )
                .join(" ");
        }


        /* =====================================================
           BACK
        ===================================================== */

        function goBack() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "index.html";
            }
        }


        /* =====================================================
           LOAD MANGA INFO
        ===================================================== */

        async function loadMangaInfo() {

            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/manga"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Manga API failed"
                    );
                }


                const data =
                    await response.json();


                const manga =
                    data.find(
                        item =>
                            item.id === mangaId
                    );


                if (!manga) {

                    throw new Error(
                        "Manga not found"
                    );
                }


                const apiTitle =
                    String(manga.title || "").trim();
                const title =
                    apiTitle && apiTitle.toLowerCase() !== String(manga.id || "").toLowerCase()
                        ? apiTitle
                        : formatTitle(manga.id);


                headerTitle.textContent =
                    title;


                mainTitle.textContent =
                    title;


                if (manga.cover) {

                    cover.src =
                        manga.cover;
                }


                cover.alt =
                    title;


                // Keep the existing description when no summary is provided.
                const summary =
                    typeof manga.summary === "string"
                        ? manga.summary.trim()
                        : "";

                if (summary) {
                    document.getElementById("description").textContent = summary;
                }


                document.title =
                    title +
                    " - Story About Us";


            } catch (err) {

                console.error(
                    err
                );


                const title =
                    formatTitle(
                        mangaId
                    );


                headerTitle.textContent =
                    title;


                mainTitle.textContent =
                    title;
            }
        }


        /* =====================================================
           LOAD CHAPTERS
        ===================================================== */

        async function loadChapters() {

            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/manga/" +
                        encodeURIComponent(
                            mangaId
                        )
                    );


                if (!response.ok) {

                    throw new Error(
                        "Chapter API failed"
                    );
                }


                const data =
                    await response.json();


                if (Array.isArray(data)) {

                    chapters =
                        data;

                } else if (
                    Array.isArray(
                        data.chapters
                    )
                ) {

                    chapters =
                        data.chapters;

                } else {

                    chapters = [];
                }


                loading.style.display =
                    "none";


                renderChapters();


            } catch (err) {

                console.error(
                    err
                );


                loading.style.display =
                    "none";


                error.style.display =
                    "block";
            }
        }


        /* =====================================================
           CHAPTER NUMBER
        ===================================================== */

        function getChapterNumber(
            chapter
        ) {

            const value =

                typeof chapter === "string"

                    ? chapter

                    : (
                        chapter.chapter ||
                        chapter.number ||
                        chapter.name ||
                        chapter.key ||
                        ""
                    );


            const match =
                String(value).match(
                    /(\d+(?:\.\d+)?)/
                );


            return match
                ? Number(
                    match[1]
                )
                : 0;
        }


        /* =====================================================
           CHAPTER LABEL
        ===================================================== */

        function getChapterLabel(chapter) {
            let label;

            if (typeof chapter === "string") {
                label = chapter
                    .replace(/\.pdf$/i, "")
                    .replace(/^.*\//, "");
            } else {
                label =
                    chapter.label ??
                    chapter.chapter ??
                    chapter.number ??
                    chapter.name ??
                    "Chapter";
            }

            const text = String(label);
            return /^\d+(?:\.\d+)?$/.test(text)
                ? text.replace(/^0+(?=\d)/, "")
                : text;
        }

        /* =====================================================
           CHAPTER URL
        ===================================================== */

        function getChapterUrl(
            chapter
        ) {

            /*
             * Prioritas:
             * URL dari API.
             */

            if (
                typeof chapter === "object"
            ) {

                if (chapter.url) {

                    return chapter.url;
                }


                if (chapter.pdf) {

                    return chapter.pdf;
                }


                if (chapter.file) {

                    return chapter.file;
                }
            }


            /*
             * Fallback CDN
             */

            const number =
                getChapterNumber(
                    chapter
                );


            const padded =
                String(
                    number
                ).padStart(
                    3,
                    "0"
                );


            return (

                "https://cdn.storyabout-us.com/pdf/" +

                encodeURIComponent(
                    mangaId
                ) +

                "/" +

                padded +

                ".pdf"
            );
        }


        /* =====================================================
           RENDER CHAPTERS
        ===================================================== */

        function renderChapters() {

            chapterList.innerHTML =
                "";


            if (
                chapters.length === 0
            ) {

                chapterList.innerHTML =
                    `
                    <div class="loading">
                        No chapters found.
                    </div>
                    `;

                return;
            }


            const sorted =
                [...chapters].sort(
                    (a, b) => {

                        const numberA =
                            getChapterNumber(
                                a
                            );


                        const numberB =
                            getChapterNumber(
                                b
                            );


                        return ascending

                            ? numberA - numberB

                            : numberB - numberA;
                    }
                );


            sorted.forEach(
                chapter => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "chapter-button";


                    const label =
                        getChapterLabel(
                            chapter
                        );


                    button.innerHTML =

                        `
                        <span class="chapter-number">
                            CHAPTER ${label}
                        </span>

                        <span class="chapter-arrow">
                            ›
                        </span>
                        `;


                    /*
                     * Buka READER, bukan PDF langsung.
                     *
                     * Reader akan mengambil PDF dari API/CDN
                     * dan menangani perpindahan chapter otomatis.
                     */

                    const chapterNumber =
                        getChapterNumber(
                            chapter
                        );


                    button.onclick =
                        () => {

                            if (!chapterNumber) {
                                return;
                            }


                            window.location.href =
                                "reader.html?title=" +
                                encodeURIComponent(mangaId) +
                                "&chapter=" +
                                encodeURIComponent(
                                    chapterNumber
                                );

                        };


                    chapterList.appendChild(
                        button
                    );
                }
            );
        }


        /* =====================================================
           SORT CHAPTER
        ===================================================== */

        sortButton.addEventListener(
            "click",
            function () {

                ascending =
                    !ascending;


                this.textContent =
                    ascending
                        ? "A → Z"
                        : "Z → A";


                renderChapters();
            }
        );


        /* =====================================================
           STARS
        ===================================================== */

        stars.forEach(
            star => {

                star.addEventListener(
                    "mouseenter",
                    function () {

                        highlightStars(
                            Number(
                                this.dataset.rating
                            )
                        );
                    }
                );


                star.addEventListener(
                    "mouseleave",
                    function () {

                        highlightStars(
                            selectedRating
                        );
                    }
                );


                star.addEventListener(
                    "click",
                    function () {

                        selectedRating =
                            Number(
                                this.dataset.rating
                            );


                        highlightStars(
                            selectedRating
                        );
                    }
                );
            }
        );


        function highlightStars(
            rating
        ) {

            stars.forEach(
                star => {

                    const value =
                        Number(
                            star.dataset.rating
                        );


                    if (
                        value <= rating
                    ) {

                        star.textContent =
                            "★";

                        star.classList.add(
                            "selected"
                        );

                    } else {

                        star.textContent =
                            "☆";

                        star.classList.remove(
                            "selected"
                        );
                    }
                }
            );
        }


        /* =====================================================
           SHOW COMMENT MESSAGE
        ===================================================== */

        function showCommentMessage(
            message,
            type
        ) {

            commentMessage.textContent =
                message;


            commentMessage.className =
                "comment-message show " +
                type;


            setTimeout(
                () => {

                    commentMessage.className =
                        "comment-message";

                },
                4000
            );
        }


        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDate(
            timestamp
        ) {

            if (!timestamp) {

                return "";
            }


            const date =
                new Date(
                    timestamp
                );


            return date.toLocaleDateString(
                "id-ID",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );
        }


        /* =====================================================
           LOAD COMMENTS FROM D1
        ===================================================== */

        async function loadComments() {

            commentList.innerHTML =
                `
                <div class="no-comments">
                    Loading comments...
                </div>
                `;


            try {

                const response =
                    await fetch(

                        API_BASE +

                        "/api/comments/" +

                        encodeURIComponent(
                            mangaId
                        )
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load comments"
                    );
                }


                const data =
                    await response.json();


                const comments = Array.isArray(data)
                    ? data
                    : Array.isArray(data.comments)
                        ? data.comments
                        : [];


                updateRatingSummary(comments);

                renderComments(
                    comments
                );


            } catch (err) {

                console.error(
                    err
                );


                commentList.innerHTML =
                    `
                    <div class="no-comments">
                        Unable to load comments.
                    </div>
                    `;
            }
        }


        /* =====================================================
           RENDER COMMENTS
        ===================================================== */

        function updateRatingSummary(comments) {
            const ratings = comments
                .map(comment => Number(comment.rating))
                .filter(rating => Number.isInteger(rating) && rating >= 1 && rating <= 5);
            const stars = document.getElementById("ratingStars");
            const score = document.getElementById("ratingScore");
            const count = document.getElementById("ratingCount");

            if (ratings.length === 0) {
                stars.textContent = "☆☆☆☆☆";
                score.textContent = "—";
                count.textContent = "(No ratings yet)";
                return;
            }

            const average = ratings.reduce((total, rating) => total + rating, 0) / ratings.length;
            const roundedStars = Math.round(average);
            stars.textContent = "★".repeat(roundedStars) + "☆".repeat(5 - roundedStars);
            score.textContent = average.toFixed(1);
            count.textContent = `(${ratings.length} ${ratings.length === 1 ? "rating" : "ratings"})`;
        }


        function renderComments(comments) {
            commentList.replaceChildren();

            if (!comments.length) {
                const empty = document.createElement("div");
                empty.className = "no-comments";
                empty.textContent = "No comments yet. Be the first to share your thoughts.";
                commentList.appendChild(empty);
                return;
            }

            const nodes = new Map();
            comments.forEach((comment) => {
                nodes.set(String(comment.id), { ...comment, children: [] });
            });

            const roots = [];
            nodes.forEach((comment) => {
                const parent = comment.reply_to_id
                    ? nodes.get(String(comment.reply_to_id))
                    : null;
                if (parent && parent !== comment) parent.children.push(comment);
                else roots.push(comment);
            });

            function appendComment(comment, depth = 0) {
                const card = document.createElement("article");
                card.className = "comment-card";
                card.style.marginLeft = (depth * 18) + "px";

                const header = document.createElement("div");
                header.className = "comment-header";

                const name = document.createElement("span");
                name.className = "comment-name";
                name.textContent = comment.username || comment.name || "Anonymous";
                header.appendChild(name);

                const ratingNumber = Math.max(0, Math.min(5, Number(comment.rating) || 0));
                if (ratingNumber > 0) {
                    const rating = document.createElement("span");
                    rating.className = "comment-rating";
                    rating.textContent = "★".repeat(ratingNumber) + "☆".repeat(5 - ratingNumber);
                    header.appendChild(rating);
                }
                card.appendChild(header);

                if (comment.reply_to_id) {
                    const quote = document.createElement("div");
                    quote.className = "comment-reply-quote";
                    quote.textContent = "Membalas " +
                        (comment.reply_to_username || "komentar") + ": " +
                        String(comment.reply_to_text || "").slice(0, 180);
                    card.appendChild(quote);
                }

                const text = document.createElement("div");
                text.className = "comment-text";
                text.textContent = comment.text || comment.comment || "";
                card.appendChild(text);

                if (comment.created_at) {
                    const date = document.createElement("div");
                    date.className = "comment-date";
                    date.textContent = formatDate(comment.created_at);
                    card.appendChild(date);
                }

                const replyButton = document.createElement("button");
                replyButton.type = "button";
                replyButton.className = "comment-reply-button";
                replyButton.textContent = "Balas";
                replyButton.addEventListener("click", () => {
                    replyTargetId = Number(comment.id);
                    replyContextText.textContent = "Membalas komentar " +
                        (comment.username || comment.name || "pengguna");
                    replyContext.hidden = false;
                    commentInput.focus();
                });
                card.appendChild(replyButton);
                commentList.appendChild(card);

                comment.children.forEach((child) => appendComment(child, depth + 1));
            }

            roots.forEach((comment) => appendComment(comment));
        }


        /* =====================================================
           SUBMIT COMMENT
        ===================================================== */

        commentForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    nameInput.value.trim();


                const comment =
                    commentInput.value.trim();


                /*
                 * Validasi nama
                 */

                if (!ReaderAccount.authenticated && !name) {

                    showCommentMessage(
                        "Please enter your name.",
                        "error"
                    );

                    return;
                }


                /*
                 * Validasi rating
                 */

                if (
                    selectedRating < 1
                ) {

                    showCommentMessage(
                        "Please select a rating.",
                        "error"
                    );

                    return;
                }


                /*
                 * Validasi komentar
                 */

                if (!comment) {

                    showCommentMessage(
                        "Please write a comment.",
                        "error"
                    );

                    return;
                }


                /*
                 * Loading
                 */

                submitComment.disabled =
                    true;


                submitComment.textContent =
                    "Posting...";


                try {

                    const response =
                        await ReaderAccount.apiFetch(

                            API_BASE +
                            "/api/comments",

                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        manga_id:
                                            mangaId,

                                        username: ReaderAccount.authenticated ? "" : name,

                                        rating:
                                            selectedRating,

                                        reply_to_id:
                                            replyTargetId,

                                        text:
                                            comment
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            data.error ||
                            "Failed to post comment"
                        );
                    }


                    /*
                     * Reset form
                     */

                    commentForm.reset();
                    clearReplyTarget();

                    selectedRating =
                        0;


                    highlightStars(
                        0
                    );


                    showCommentMessage(
                        "Comment posted successfully!",
                        "success"
                    );


                    /*
                     * Ambil ulang komentar
                     * dari D1
                     */

                    await loadComments();


                } catch (err) {

                    console.error(
                        err
                    );


                    showCommentMessage(
                        err.message ||
                        "Unable to post comment.",
                        "error"
                    );

                } finally {

                    submitComment.disabled =
                        false;


                    submitComment.textContent =
                        "Post Comment";
                }
            }
        );


        /* =====================================================
           START
        ===================================================== */

        loadMangaInfo();

        loadChapters();

        const nameFieldGroup = document.getElementById("nameFieldGroup");
        const commentAccountStatus = document.getElementById("commentAccountStatus");
        const commentLoginButton = document.getElementById("commentTelegramLogin");
        const commentLoginPrompt = document.getElementById("commentLoginPrompt");
        function paintCommentAccount() {
            const loggedIn = ReaderAccount.authenticated;
            nameFieldGroup.hidden = loggedIn;
            nameInput.required = !loggedIn;
            commentAccountStatus.textContent = loggedIn
                ? "Komentar sebagai " + ([ReaderAccount.user.first_name, ReaderAccount.user.last_name].filter(Boolean).join(" ") || ReaderAccount.user.username || "akun Telegram")
                : "";
            commentLoginPrompt.hidden = loggedIn;
        }
        commentLoginButton.addEventListener("click", async (event) => {
            event.preventDefault();
            try { await ReaderAccount.login(); paintCommentAccount(); await loadComments(); }
            catch (error) { showCommentMessage(error.message, "error"); }
        });
        ReaderAccount.init().then(() => { paintCommentAccount(); loadComments(); });

        loadComments();

    </script>
