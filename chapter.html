<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Chapter</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


    <main class="chapter-page">


        <!-- HEADER -->
        <header class="chapter-header">

            <button
                class="back-btn"
                onclick="history.back()">

                <svg viewBox="0 0 24 24">

                    <path d="M15 18l-6-6 6-6"></path>

                </svg>

            </button>


            <div>

                <span class="small-label">
                    STORY ABOUT US
                </span>

                <h1 id="titleName">
                    Evil Deed
                </h1>

            </div>

        </header>



        <!-- COVER -->
<section class="chapter-cover-section">

    <div class="large-cover-wrapper">

        <img
            id="coverImage"
            src=""
            alt="Cover"
            class="large-cover"
        >

    </div>

    <h2 id="coverTitle">
        Judul
    </h2>

    <p class="cover-description">
        Choose a chapter and continue the story.
    </p>

</section>

        <!-- CHAPTER LIST -->
        <section class="chapter-section">

            <div class="section-title">

                <h2>Chapters</h2>

            </div>


            <div class="chapter-list">


                <!-- CHAPTER 4 -->
                <button
                    class="chapter-item"
                    onclick="openChapter(4)">

                    <div>

                        <span class="chapter-number">
                            CHAPTER 04
                        </span>

                    </div>

                    <span class="chapter-arrow">
                        ›
                    </span>

                </button>


                <!-- CHAPTER 3 -->
                <button
                    class="chapter-item"
                    onclick="openChapter(3)">

                    <div>

                        <span class="chapter-number">
                            CHAPTER 03
                        </span>

                    </div>

                    <span class="chapter-arrow">
                        ›
                    </span>

                </button>


                <!-- CHAPTER 2 -->
                <button
                    class="chapter-item"
                    onclick="openChapter(2)">

                    <div>

                        <span class="chapter-number">
                            CHAPTER 02
                        </span>

                    </div>

                    <span class="chapter-arrow">
                        ›
                    </span>

                </button>


                <!-- CHAPTER 1 -->
                <button
                    class="chapter-item"
                    onclick="openChapter(1)">

                    <div>

                        <span class="chapter-number">
                            CHAPTER 01
                        </span>

                    </div>

                    <span class="chapter-arrow">
                        ›
                    </span>

                </button>


            </div>

        </section>


    </main>


    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


    const params = new URLSearchParams(window.location.search);

    const title = params.get("title");

    const coverImage = document.getElementById("coverImage");
    const coverTitle = document.getElementById("coverTitle");

    if (title) {

        const coverUrl =
            `https://cdn.storyabout-us.com/Covers/${title}.png`;

        coverImage.src = coverUrl;

        coverTitle.textContent = title
            .replace(/-/g, " ")
            .replace(/\b\w/g, letter => letter.toUpperCase());
    }

        const currentTitle =
            titles[title] || titles["evil-deed"];


        document.getElementById("titleName")
            .textContent = currentTitle.name;


        document.getElementById("coverTitle")
            .textContent = currentTitle.name;


        document.getElementById("coverImage")
            .src = currentTitle.cover;


        document.getElementById("coverImage")
            .alt = currentTitle.name;


        document.querySelector(".cover-description")
            .textContent = currentTitle.description;


        function openChapter(chapter) {

            window.location.href =
                "reader.html?title=" +
                title +
                "&chapter=" +
                chapter;

        }

    </script>


</body>

</html>
