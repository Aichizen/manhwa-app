<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Chapter | Story About Us</title>
  <style>
    :root { color-scheme:dark; --text:#f4f2fa; --muted:#bbb7cc; --accent:#d4b1ff; --line:rgba(255,255,255,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(rgba(10,10,28,.4),rgba(10,10,28,.62)),url("homepage-bg.png") center/cover fixed; }
    main { width:min(100%,720px); margin:auto; }
    a { color:inherit; text-decoration:none; }
    .back { display:inline-block; margin-bottom:22px; color:var(--muted); }
    .panel { padding:clamp(22px,5vw,38px); border:1px solid var(--line); border-radius:20px; background:rgba(24,22,42,.9); backdrop-filter:blur(10px); }
    h1 { margin:0 0 6px; font:clamp(28px,5vw,36px)/1.15 Georgia,"Times New Roman",serif; }
    .intro { margin:0 0 24px; color:var(--muted); }
    label { display:block; margin:18px 0 7px; font-weight:650; }
    input,select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:rgba(10,11,22,.76); color:var(--text); font:inherit; }
    input[type=file] { padding:10px; }
    .hint { margin:5px 0 0; color:var(--muted); font-size:13px; }
    button { width:100%; margin-top:24px; padding:13px 18px; border:0; border-radius:10px; background:var(--accent); color:#20182b; font:700 16px system-ui,sans-serif; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:24px; margin:16px 0 0; color:var(--muted); white-space:pre-wrap; }
    #status.error { color:#ff9c9c; } #status.success { color:#95e0ad; }
    .file-list { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px; }
    .file-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(10,11,22,.46); overflow-wrap:anywhere; }
    .file-name { min-width:0; }
    .file-state { flex:none; color:var(--muted); font-size:13px; }
    .file-state.uploading { color:var(--accent); }
    .file-state.done { color:#95e0ad; }
    .file-state.failed { color:#ff9c9c; }
    .progress-track { height:7px; margin-top:16px; overflow:hidden; border-radius:10px; background:rgba(255,255,255,.12); }
    .progress-bar { width:0; height:100%; background:var(--accent); transition:width .2s ease; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="admin.html">← Kembali ke Admin</a>
    <section class="panel">
      <h1>Tambah Chapter</h1>
      <p class="intro">Pilih manhwa dan PDF chapter. Nama file diurutkan A–Z sebelum diunggah.</p>
      <form id="addChapterForm">
        <label for="adminToken">Admin token</label>
        <input id="adminToken" name="adminToken" type="password" autocomplete="off" required>

        <label for="mangaSelect">Manhwa</label>
        <select id="mangaSelect" name="mangaId" required>
          <option value="">Memuat daftar manhwa...</option>
        </select>

        <label for="chapterNumber">Chapter</label>
        <input id="chapterNumber" name="chapter" type="text" inputmode="decimal" placeholder="Pilih manhwa terlebih dahulu" required>
        <p class="hint">Nomor otomatis diisi chapter terakhir + 1. Anda dapat mengubahnya secara manual.</p>

        <label for="chapterPdfs">File PDF</label>
        <input id="chapterPdfs" name="pdfs" type="file" accept="application/pdf,.pdf" multiple required>
        <p class="hint">Pilih satu atau beberapa PDF. Maksimal 50 MB per file.</p>

        <section id="previewSection" aria-label="Daftar file terpilih" hidden>
          <ul id="fileList" class="file-list"></ul>
        </section>
        <div id="progressSection" hidden>
          <div class="progress-track" role="progressbar" aria-label="Progres upload" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>
        <button id="submitButton" type="submit">UPLOAD CHAPTER</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const API_BASE = "https://story-about-us-api.aichinose219.workers.dev";
    const form = document.getElementById("addChapterForm");
    const mangaSelect = document.getElementById("mangaSelect");
    const chapterNumber = document.getElementById("chapterNumber");
    const fileInput = document.getElementById("chapterPdfs");
    const previewSection = document.getElementById("previewSection");
    const fileList = document.getElementById("fileList");
    const progressSection = document.getElementById("progressSection");
    const progressTrack = progressSection.querySelector('[role="progressbar"]');
    const progressBar = document.getElementById("progressBar");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");
    let selectionRequest = 0;
    let sortedFiles = [];

    function sortFiles(files) {
      return [...files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:"base" }));
    }

    function renderFileList(states = []) {
      fileList.replaceChildren();
      sortedFiles.forEach((file, index) => {
        const row = document.createElement("li");
        row.className = "file-row";
        const name = document.createElement("span");
        name.className = "file-name";
        name.textContent = file.name;
        const state = document.createElement("span");
        const entry = states[index] || { label:"Menunggu", kind:"" };
        state.className = `file-state ${entry.kind}`;
        state.textContent = entry.label;
        row.append(name, state);
        fileList.append(row);
      });
      previewSection.hidden = sortedFiles.length === 0;
    }

    async function loadMangaList() {
      try {
        const response = await fetch(`${API_BASE}/api/manga`, { cache:"no-store" });
        if (!response.ok) throw new Error("Daftar manhwa tidak dapat dimuat.");
        const mangaList = await response.json();
        mangaSelect.replaceChildren(new Option("Pilih manhwa", ""));
        mangaList.forEach(manga => mangaSelect.add(new Option(manga.title || manga.id, manga.id)));
      } catch (error) {
        mangaSelect.replaceChildren(new Option("Daftar manhwa tidak tersedia", ""));
        statusEl.className = "error";
        statusEl.textContent = error.message;
      }
    }

    async function setNextChapter(mangaId) {
      const requestNumber = ++selectionRequest;
      chapterNumber.value = "";
      if (!mangaId) {
        chapterNumber.placeholder = "Pilih manhwa terlebih dahulu";
        return;
      }
      chapterNumber.placeholder = "Memuat...";
      statusEl.className = "";
      statusEl.textContent = "Memeriksa chapter yang sudah ada...";
      try {
        const response = await fetch(`${API_BASE}/api/manga/${encodeURIComponent(mangaId)}`, { cache:"no-store" });
        if (!response.ok) throw new Error("Data chapter tidak dapat dibaca.");
        const detail = await response.json();
        if (requestNumber !== selectionRequest) return;
        const chapters = Array.isArray(detail) ? detail : (Array.isArray(detail.chapters) ? detail.chapters : []);
        const numbers = chapters.map(item => Number(item.number ?? item.chapter)).filter(number => Number.isFinite(number) && number >= 0);
        chapterNumber.value = String(numbers.length ? Math.max(...numbers) + 1 : 1);
        chapterNumber.placeholder = "";
        statusEl.textContent = "";
      } catch (error) {
        if (requestNumber !== selectionRequest) return;
        chapterNumber.placeholder = "Isi nomor chapter";
        statusEl.className = "error";
        statusEl.textContent = `${error.message} Isi nomor chapter secara manual.`;
      }
    }

    mangaSelect.addEventListener("change", () => setNextChapter(mangaSelect.value));
    fileInput.addEventListener("change", () => {
      sortedFiles = sortFiles(fileInput.files);
      renderFileList();
      progressSection.hidden = true;
      statusEl.className = "";
      statusEl.textContent = "";
    });
    loadMangaList();

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!sortedFiles.length) {
        statusEl.className = "error";
        statusEl.textContent = "Pilih minimal satu file PDF.";
        return;
      }
      const invalid = sortedFiles.find(file => !file.name.toLowerCase().endsWith(".pdf") || file.size > 50 * 1024 * 1024);
      if (invalid) {
        statusEl.className = "error";
        statusEl.textContent = `${invalid.name}: pastikan file berupa PDF dengan ukuran maksimal 50 MB.`;
        return;
      }

      const token = document.getElementById("adminToken").value;
      const mangaId = mangaSelect.value;
      const statuses = sortedFiles.map(() => ({ label:"Menunggu", kind:"" }));
      let failed = [];
      submitButton.disabled = true;
      submitButton.textContent = "MENGUNGGAH...";
      progressSection.hidden = false;
      statusEl.className = "";
      renderFileList(statuses);

      for (let index = 0; index < sortedFiles.length; index++) {
        const file = sortedFiles[index];
        statuses[index] = { label:"Sedang diunggah...", kind:"uploading" };
        renderFileList(statuses);
        statusEl.textContent = `Mengunggah ${index + 1} dari ${sortedFiles.length}: ${file.name}`;
        try {
          const formData = new FormData();
          formData.append("mangaId", mangaId);
          formData.append("pdfs", file, file.name);
          // Dikirim untuk kompatibilitas field chapter; Worker menentukan nomor dari metadata chapter.
          formData.append("chapter", chapterNumber.value.trim());
          const response = await fetch(`${API_BASE}/api/admin/chapter`, {
            method:"POST",
            headers:{ Authorization:`Bearer ${token}` },
            body:formData
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `Permintaan gagal (${response.status}).`);
          statuses[index] = { label:"Berhasil", kind:"done" };
        } catch (error) {
          statuses[index] = { label:`Gagal: ${error.message || "Upload gagal"}`, kind:"failed" };
          failed.push(file.name);
        }
        renderFileList(statuses);
        const percent = Math.round(((index + 1) / sortedFiles.length) * 100);
        progressBar.style.width = `${percent}%`;
        progressTrack.setAttribute("aria-valuenow", String(percent));
      }

      submitButton.disabled = false;
      submitButton.textContent = "UPLOAD CHAPTER";
      if (failed.length === 0) {
        previewSection.hidden = true;
        fileInput.value = "";
        sortedFiles = [];
        statusEl.className = "success";
        statusEl.textContent = `Upload berhasil. ${statuses.length} chapter berhasil diunggah.`;
        await setNextChapter(mangaId);
        statusEl.className = "success";
        statusEl.textContent = `Upload berhasil. ${statuses.length} chapter berhasil diunggah.`;
      } else {
        statusEl.className = "error";
        statusEl.textContent = `Sebagian upload gagal. Periksa daftar file berstatus gagal: ${failed.join(", ")}. File yang berhasil tidak perlu diunggah ulang.`;
      }
    });
  </script>
</body>
</html>
