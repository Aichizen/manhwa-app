<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Chapter | Story About Us</title>
  <style>
    :root { color-scheme:dark; --text:#f4f2fa; --muted:#bbb7cc; --accent:#d4b1ff; --line:rgba(255,255,255,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(rgba(10,10,28,.4),rgba(10,10,28,.62)),url("homepage-bg.png") center/cover fixed; }
    main { width:min(100%,680px); margin:auto; }
    a { color:inherit; text-decoration:none; }
    .back { display:inline-block; margin-bottom:22px; color:var(--muted); }
    .panel { padding:clamp(22px,5vw,38px); border:1px solid var(--line); border-radius:20px; background:rgba(24,22,42,.88); backdrop-filter:blur(10px); }
    h1 { margin:0 0 6px; font:clamp(28px,5vw,36px)/1.15 Georgia,"Times New Roman",serif; }
    .intro { margin:0 0 24px; color:var(--muted); }
    label { display:block; margin:18px 0 7px; font-weight:650; }
    input,select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:rgba(10,11,22,.76); color:var(--text); font:inherit; }
    input[type=file] { padding:10px; } input[readonly] { color:var(--accent); }
    .hint { margin:5px 0 0; color:var(--muted); font-size:13px; }
    button { width:100%; margin-top:24px; padding:13px 18px; border:0; border-radius:10px; background:var(--accent); color:#20182b; font:700 16px system-ui,sans-serif; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:24px; margin:16px 0 0; color:var(--muted); white-space:pre-wrap; }
    #status.error { color:#ff9c9c; } #status.success { color:#95e0ad; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="admin.html">← Back to Admin</a>
    <section class="panel">
      <h1>Add Chapter</h1>
      <p class="intro">Nomor chapter berikutnya dihitung otomatis dari folder manhwa.</p>
      <form id="addChapterForm">
        <label for="adminToken">Admin token</label>
        <input id="adminToken" name="adminToken" type="password" autocomplete="off" required>

        <label for="mangaSelect">Manhwa</label>
        <select id="mangaSelect" name="mangaId" required>
          <option value="">Loading manhwa...</option>
        </select>

        <label for="chapterNumber">Next chapter</label>
        <input id="chapterNumber" name="chapter" type="text" value="" placeholder="Select manhwa first" readonly required>
        <p class="hint">Nomor ini akan menjadi nama PDF, misalnya <code>005.pdf</code>.</p>

        <label for="chapterPdf">PDF file</label>
        <input id="chapterPdf" name="pdf" type="file" accept="application/pdf,.pdf" required>
        <p class="hint">Maksimal 50 MB.</p>

        <button id="submitButton" type="submit">UPLOAD CHAPTER</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const API_BASE = "https://story-about-us-api.aichinose219.workers.dev";
    const form = document.getElementById("addChapterForm");
    const mangaSelect = document.getElementById("mangaSelect");
    const chapterNumber = document.getElementById("chapterNumber");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");
    let selectionRequest = 0;

    async function loadMangaList() {
      try {
        const response = await fetch(`${API_BASE}/api/manga`, { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load manhwa list.");
        const mangaList = await response.json();
        mangaSelect.replaceChildren(new Option("Select manhwa", ""));
        mangaList.forEach(manga => mangaSelect.add(new Option(manga.title || manga.id, manga.id)));
      } catch (error) {
        mangaSelect.replaceChildren(new Option("Unable to load manhwa list", ""));
        statusEl.className = "error";
        statusEl.textContent = error.message;
      }
    }

    async function setNextChapter(mangaId) {
      const requestNumber = ++selectionRequest;
      chapterNumber.value = "";
      if (!mangaId) {
        chapterNumber.placeholder = "Select manhwa first";
        return;
      }
      chapterNumber.placeholder = "Loading...";
      statusEl.className = "";
      statusEl.textContent = "Checking existing chapters...";
      try {
        const response = await fetch(`${API_BASE}/api/manga/${encodeURIComponent(mangaId)}`, { cache: "no-store" });
        if (!response.ok) throw new Error("Could not read existing chapters.");
        const chapters = await response.json();
        if (requestNumber !== selectionRequest) return;
        const numbers = Array.isArray(chapters)
          ? chapters.map(item => Number(item.number)).filter(number => Number.isFinite(number) && number >= 0)
          : [];
        const next = numbers.length ? Math.max(...numbers) + 1 : 1;
        chapterNumber.value = String(next);
        chapterNumber.placeholder = "";
        statusEl.textContent = `Next chapter: ${next}`;
      } catch (error) {
        if (requestNumber !== selectionRequest) return;
        statusEl.className = "error";
        statusEl.textContent = `${error.message} Nomor chapter tidak dapat dihitung.`;
      }
    }

    mangaSelect.addEventListener("change", () => setNextChapter(mangaSelect.value));
    loadMangaList();

    form.addEventListener("submit", async event => {
      event.preventDefault();
      statusEl.className = "";
      statusEl.textContent = `Uploading Chapter ${chapterNumber.value}...`;
      submitButton.disabled = true;
      try {
        const formData = new FormData(form);
        const token = formData.get("adminToken");
        formData.delete("adminToken");
        const response = await fetch(`${API_BASE}/api/admin/chapter`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
        statusEl.className = "success";
        const next = Number(result.chapter) + 1;
        chapterNumber.value = String(next);
        document.getElementById("chapterPdf").value = "";
        statusEl.textContent = `Chapter ${result.chapter} uploaded. Next chapter: ${next}.`;
      } catch (error) {
        statusEl.className = "error";
        statusEl.textContent = error.message || "Unable to contact the API.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
