<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        const pageParams = new URLSearchParams(location.search);
        const launchParams = new URLSearchParams(location.hash.replace(/^#/, ""));
        const launchedFromTelegram = /Telegram/i.test(navigator.userAgent)
            || pageParams.has("tgWebAppPlatform")
            || launchParams.has("tgWebAppPlatform");
        if (launchedFromTelegram && pageParams.get("view") !== "mobile") {
            pageParams.set("view", "mobile");
            history.replaceState(null, "", `${location.pathname}?${pageParams.toString()}${location.hash}`);
        }
        const isTelegramView = pageParams.get("view") === "mobile";
        document.documentElement.classList.add(isTelegramView ? "telegram-view" : "browser-view");
    </script>
    <script>
        if (document.documentElement.classList.contains("telegram-view")) {
            const mobileAdScript = document.createElement("script");

            mobileAdScript.dataset.sdk = "show_12033217";
            document.head.appendChild(mobileAdScript);
        }
    </script>
    <script>
        if (document.documentElement.classList.contains("browser-view")) {
            const desktopAdScript = document.createElement("script");
            desktopAdScript.src = "https://quge5.com/88/tag.min.js";
            desktopAdScript.dataset.zone = "298987";
            desktopAdScript.async = true;
            desktopAdScript.dataset.cfasync = "false";
            document.head.appendChild(desktopAdScript);

    </script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Story About Us</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="account.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: #0c1024;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            color: #f4f2fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    rgba(10, 13, 30, 0.28),
                    rgba(10, 13, 30, 0.80)
                ),
                url("https://cdn.storyabout-us.com/Theme/homepage-bg.png");

            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;

            padding:
                18px 28px 50px 18px;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 4px 0 12px;
        }


        .admin-link {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            gap: 8px;
            margin-top: 0;
            padding: 10px 15px;
            border: 1px solid rgba(196,156,255,.38);
            border-radius: 999px;
            background: rgba(22,20,44,.52);
            color: #e1d0ff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .3px;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: background .2s ease, transform .2s ease;
        }

        .admin-link:hover,
        .login-link:hover {
            background: rgba(100,73,145,.48);
            transform: translateY(-1px);
        }

        .admin-link[hidden],
        .login-link[hidden] {
            display: none !important;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .login-link {
            font-family: inherit;
            cursor: pointer;
        }

        .hero-title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(43px, 8vw, 68px);

            line-height: 1;

            letter-spacing: -2px;

            color: #f3f1f8;

            text-shadow:
                0 3px 20px rgba(0,0,0,.25);
        }


        .hero-title .accent {
            color: #c49cff;
        }


        .hero-description {
            max-width: 550px;

            margin-top: 8px;
            color: #aaa9c5;
            font-size: 15px;
            line-height: 1.4;
            letter-spacing: .3px;
        }

        .announcement-panel {
            margin: 8px 0 18px;
            padding: 16px 18px;
            border: 1px solid rgba(196,156,255,.28);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(72,48,112,.62), rgba(25,29,53,.76));
            box-shadow: 0 12px 32px rgba(0,0,0,.18);
            backdrop-filter: blur(10px);
        }
        .announcement-panel[hidden] { display:none !important; }
        .announcement-heading { color:#d8bdff; font-size:12px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; }
        .announcement-content { min-height:70px; }
        .announcement-message { margin-top:6px; color:#f4f2fa; font-size:14px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; }
        .announcement-date { display:block; margin-top:6px; color:#aaa9c5; font-size:11px; }
        .announcement-pagination { display:flex; justify-content:flex-end; gap:5px; margin-top:10px; }
        .announcement-dot { width:7px; height:7px; padding:0; border:0; border-radius:50%; background:rgba(216,189,255,.35); }
        .announcement-dot.active { width:18px; border-radius:99px; background:#c49cff; }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-container {
            position: relative;
            z-index: 50;

            width: 100%;

            margin-bottom: 18px;
        }


        .search-wrapper {
            position: relative;
        }


        .search-icon {
            position: absolute;

            left: 19px;
            top: 50%;

            transform: translateY(-50%);

            color: #a8abc5;

            font-size: 21px;

            pointer-events: none;
        }


        .search-box {
            width: 100%;
            height: 57px;

            padding:
                0 18px 0 52px;

            border:
                1px solid
                rgba(172,177,218,.22);

            border-radius: 18px;

            outline: none;

            background:
                rgba(28,32,58,.84);

            color: white;

            font-size: 16px;

            backdrop-filter: blur(14px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.20);
        }


        .search-box::placeholder {
            color: #81859f;
        }


        .search-box:focus {
            border-color:
                rgba(195,164,255,.45);
        }


        /* =====================================================
           SEARCH SUGGESTIONS
        ===================================================== */

        .suggestions {
            position: absolute;

            left: 0;
            right: 0;

            top: 65px;

            display: none;

            padding: 8px;

            max-height: 300px;

            overflow-y: auto;

            background:
                rgba(25,28,50,.97);

            border:
                1px solid
                rgba(163,170,208,.20);

            border-radius: 17px;

            box-shadow:
                0 18px 45px
                rgba(0,0,0,.38);

            backdrop-filter: blur(18px);
        }


        .suggestions.show {
            display: block;
        }


        .suggestion-item {
            width: 100%;

            min-height: 49px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            border: none;
            border-radius: 11px;

            background: transparent;

            color: #eeeeF5;

            font-size: 15px;

            text-align: left;

            cursor: pointer;
        }


        .suggestion-item:hover {
            background:
                rgba(108,116,164,.20);
        }


        .no-suggestion {
            padding: 15px;

            color: #777c97;

            text-align: center;
        }


        /* =====================================================
           AD SLOT
        ===================================================== */

        .ad-slot {
            width: 100%;
            min-height: 50px;
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            overflow: hidden;
            border-radius: 14px;
        }

        .ad-action-button {
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid rgba(184, 173, 225, .25);
            border-radius: 12px;
            background: rgba(55, 61, 96, .78);
            color: #ddd7ee;
            font-size: 13px;
            cursor: pointer;
        }

        .ad-action-button:disabled { opacity: .6; cursor: wait; }
        .browser-view .mobile-popup-ad { display:none; }
        .ad-status { flex-basis: 100%; min-height: 18px; color: #a3a4bd; font-size: 12px; text-align: center; }


        /* =====================================================
           ALPHABET NAVIGATION
        ===================================================== */

        .alphabet-nav {
            position: fixed;

            right: 5px;
            top: 50%;

            transform: translateY(-50%);

            z-index: 100;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 2px;

            padding: 7px 4px;

            border-radius: 15px;

            background:
                rgba(20,24,46,.48);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);
        }


        .alphabet-letter {
            width: 24px;
            height: 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 6px;

            background: transparent;

            color: #626782;

            font-size: 10px;
            font-weight: 600;

            cursor: default;

            transition:
                color .15s ease,
                background .15s ease,
                transform .15s ease;
        }


        /* Huruf yang mempunyai manga */

        .alphabet-letter.active {
            color: #ddd0ff;

            cursor: pointer;
        }


        .alphabet-letter.active:hover {
            background:
                rgba(179,153,232,.18);

            color: white;
        }


        .alphabet-letter.active:active {
            transform: scale(.88);
        }


        /* Huruf yang sedang dipilih */

        .alphabet-letter.current {
            background:
                rgba(184,151,238,.28);

            color: white;
        }


        /* =====================================================
           LETTER SECTION
        ===================================================== */

        .letter-section {
            scroll-margin-top: 20px;

            margin-bottom: 22px;
        }


        .letter-title {
            margin-bottom: 12px;

            padding-left: 3px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;

            color: #cbaaff;

            font-weight: 700;
        }


        /* =====================================================
           MANGA GRID
        ===================================================== */

        .manga-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 18px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .manga-card {
            position: relative;

            overflow: hidden;

            min-width: 0;

            border:
                1px solid
                rgba(166,174,216,.20);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(48,54,84,.94),
                    rgba(37,42,70,.94)
                );

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.22);

            cursor: pointer;

            transition:
                transform .18s ease;
        }


        .manga-card.status-end {
            border-color: rgba(193,151,105,.42);
            background: linear-gradient(145deg, rgba(64,58,53,.96), rgba(52,48,68,.96));
        }

        .manga-card.status-end-season {
            border-color: rgba(143,130,177,.46);
            background: linear-gradient(145deg, rgba(57,54,70,.96), rgba(48,48,68,.96));
        }

        .manga-card.status-hiatus {
            border-color: rgba(112,151,157,.44);
            background: linear-gradient(145deg, rgba(48,62,67,.96), rgba(46,51,70,.96));
        }


        .manga-card:hover {
            transform:
                translateY(-3px);
        }


        .manga-card:active {
            transform:
                scale(.985);
        }


        /* =====================================================
           COVER
        ===================================================== */

        .cover-wrapper {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 10;

            overflow: hidden;

            background: #292e4c;
        }


        .manga-cover {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform .3s ease;
        }


        .manga-card:hover .manga-cover {
            transform: scale(1.025);
        }


        /* =====================================================
           CARD BOTTOM
        ===================================================== */

        .card-bottom {
            min-height: 82px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding:
                12px
                12px
                12px
                17px;
        }


        .manga-title {
            flex: 1;

            min-width: 0;

            color: #f3f1f7;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;

            line-height: 1.08;

            font-weight: 700;

            overflow-wrap: anywhere;
        }


        /* =====================================================
           FAVORITE
        ===================================================== */

        .favorite-button {
            flex-shrink: 0;

            width: 49px;
            height: 49px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background:
                rgba(91,97,145,.75);

            color: #f4f1fa;

            font-size: 30px;

            cursor: pointer;
        }


        .favorite-button.active {
            color: #d3adff;

            background:
                rgba(99,83,143,.85);
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading,
        .error-message,
        .empty-message {
            grid-column: 1 / -1;

            padding: 60px 10px;

            color: #858aa5;

            text-align: center;
        }


        .error-message,
        .empty-message {
            display: none;
        }


        .error-message.show,
        .empty-message.show {
            display: block;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .container {
                padding:
                    16px 28px 40px 14px;
            }


            .hero {
                min-height: 0;
            }


            .hero-title {
                font-size: 43px;
            }


            .hero-description {
                font-size: 15px;
            }


            .manga-grid {
                gap: 13px;
            }


            .manga-card {
                border-radius: 19px;
            }


            .card-bottom {
                min-height: 72px;

                padding:
                    9px 9px 9px 12px;
            }


            .manga-title {
                font-size: 17px;
            }


            .favorite-button {
                width: 43px;
                height: 43px;

                font-size: 27px;
            }


            /* Alphabet lebih kecil */

            .alphabet-nav {
                right: 2px;

                gap: 1px;

                padding:
                    5px 2px;
            }


            .alphabet-letter {
                width: 21px;
                height: 19px;

                font-size: 9px;
            }


            .letter-title {
                font-size: 24px;
            }
        }


        /* =====================================================
           VERY SMALL PHONE
        ===================================================== */

        @media (max-width: 360px) {

            .container {
                padding-left: 11px;
                padding-right: 25px;
            }


            .hero-title {
                font-size: 39px;
            }


            .manga-grid {
                gap: 10px;
            }


            .manga-title {
                font-size: 15px;
            }


            .favorite-button {
                width: 39px;
                height: 39px;

                font-size: 25px;
            }


            .alphabet-letter {
                width: 19px;
                height: 18px;

                font-size: 8px;
            }
        }

    
        .account-tabs { display:flex; width:100%; box-sizing:border-box; gap:8px; margin:0; padding:6px; border:1px solid rgba(170,177,216,.17); border-radius:16px; background:rgba(31,36,63,.82); }
        .telegram-view .account-tabs { margin-bottom:28px; }
        .account-tabs[hidden] { display:none; }
        .account-tab { flex:1; min-height:40px; padding:8px 10px; border:0; border-radius:11px; color:#d7d4e5; background:transparent; font:inherit; cursor:pointer; }
        .account-tab.active { color:#fff; background:linear-gradient(135deg,#b783d1,#8866ad); }
        .last-read-label { margin:8px 0 18px; color:#d5c4e2; font-size:13px; text-align:center; }
    
        /* Penyesuaian grid manga */
        .cover-wrapper {
            aspect-ratio: 2 / 3;
        }

        .manga-cover {
            object-fit: contain;
            transition: none;
        }

        .manga-card:hover .manga-cover {
            transform: none;
        }

        .manga-title {

        @media (max-width: 480px) {

            .browser-view .alphabet-nav { position: relative; z-index: 2; width: calc(100% - 9vw); min-height: 62px; margin: -31px auto 28px; padding: 7px 12px; flex-direction: row; justify-content: space-between; gap: 3px; border: 1px solid rgba(190,151,255,.48); border-radius: 24px; background: rgba(35,28,57,.96); box-shadow: 0 0 34px rgba(155,100,220,.24); }
            .browser-view .alphabet-letter { flex: 1 1 0; width: auto; height: 38px; border-radius: 999px; font-size: 10px; }
            .browser-view .manga-grid { width: min(91%,1660px); margin-inline: auto; grid-template-columns: repeat(auto-fill,minmax(156px,1fr)); gap: 22px 20px; }
            .browser-view .cover-wrapper { aspect-ratio: 4 / 5; }
            .browser-view .card-bottom { min-height: 64px; padding: 8px 10px 8px 15px; gap: 8px; }
            .browser-view .manga-title { font-family: Georgia,"Times New Roman",serif; font-size: 16px; line-height: 1.15; }
            .browser-view .favorite-button { flex: 0 0 36px; width: 36px; height: 36px; font-size: 21px; }
        }

        @media (min-width: 701px) {
            .telegram-view body { background: linear-gradient(180deg,rgba(10,13,30,.28),rgba(10,13,30,.8)),url("https://cdn.storyabout-us.com/Theme/homepage-bg.png") center top / cover fixed no-repeat; }
            .telegram-view .container { width:100%; max-width:480px; margin:0 auto; padding:18px 34px 50px 14px; }
            .telegram-view .hero { min-height:205px; justify-content:flex-start; padding:4px 0 12px; background:none; }
            .telegram-view .hero-title,.telegram-view .hero-description { visibility:visible; }
            .telegram-view .hero-title { max-width:350px; font-size:45px; line-height:.99; letter-spacing:-1.7px; }
            .telegram-view .hero-description { max-width:310px; margin-top:20px; font-size:15px; line-height:1.65; }
            .telegram-view .hero-actions { position:static; margin-top:12px; }
            .telegram-view .search-container { position:relative; top:auto; right:auto; width:100%; margin-bottom:10px; }
            .telegram-view .search-box { height:54px; border-radius:16px; font-size:15px; padding-left:51px; }
            .telegram-view .alphabet-nav { position:fixed; top:50%; right:max(2px,calc((100vw - 480px)/2 + 2px)); width:auto; min-height:0; margin:0; padding:5px 2px; transform:translateY(-50%); flex-direction:column; gap:1px; border:0; border-radius:15px; background:rgba(20,24,46,.48); box-shadow:none; }
            .telegram-view .alphabet-letter { flex:0 0 19px; width:21px; height:19px; font-size:9px; }
            .telegram-view .manga-grid { width:100%; margin:0; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
            .telegram-view .cover-wrapper { aspect-ratio:4 / 5; }
            .telegram-view .card-bottom { min-height:48px; padding:7px 5px; }
            .telegram-view .manga-title { font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.25; }
            .telegram-view .favorite-button { width:27px; height:27px; font-size:18px; }
        }
    </style>
</head>


<body>


    <!-- =====================================================
         ALPHABET
    ====================================================== -->

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">
                <span class="accent">Story</span> About Us
            </h1>

            <p class="hero-description">
                A few stories, memories, and moments that led us here.
            </p>

            <div class="hero-actions">
                <a class="admin-link" href="admin.html">Admin</a>
                <button id="telegramLoginButton" class="admin-link login-link" type="button" hidden>Login</button>
            </div>
        </section>

        <aside id="announcementPanel" class="announcement-panel" aria-live="polite" hidden>
            <h2 class="announcement-heading">Information</h2>
            <div id="announcementContent" class="announcement-content" aria-atomic="true">
                <p id="announcementMessage" class="announcement-message"></p>
                <time id="announcementDate" class="announcement-date"></time>
            </div>
            <nav id="announcementPagination" class="announcement-pagination" aria-label="Pilih informasi" hidden></nav>
        </aside>

        <!-- =================================================
             SEARCH
        ================================================== -->

        <div class="search-container">

            <div class="search-wrapper">

                <span class="search-icon">
                    ⌕
                </span>


                <input
                    id="searchInput"
                    class="search-box"
                    type="text"
                    placeholder="Search manga..."
                    autocomplete="off"
                    spellcheck="false"
                >


                <div
                    id="suggestions"
                    class="suggestions"
                ></div>

            </div>

        </div>

        <nav id="accountTabs" class="account-tabs" aria-label="Navigasi koleksi" hidden>
            <button class="account-tab active" type="button" data-view="home">Home</button>
            <button class="account-tab" type="button" data-view="favorites">Favorite</button>
            <button class="account-tab" type="button" data-view="last-read">Last Read</button>
        </nav>

        <nav
            id="alphabetNav"
            class="alphabet-nav"
            aria-label="Manga alphabet navigation"
        ></nav>


        <!-- =================================================
             OPTIONAL REWARDED AD
        ================================================== -->
        <div class="ad-slot" aria-label="Optional rewarded advertisement">
            <button id="watchHomeAd" class="ad-action-button" type="button">Watch an ad to support the site</button>
            <button id="watchHomePopup" class="ad-action-button mobile-popup-ad" type="button">Open sponsor page</button>
            <span id="homeAdStatus" class="ad-status" role="status" aria-live="polite"></span>
        </div>

        <!-- =================================================
             MANGA LIST
        ================================================== -->

        <div id="mangaContainer">

            <div class="loading" id="loading">
                Loading stories...
            </div>

        </div>


        <div
            id="errorMessage"
            class="error-message"
        >
            Unable to load the manga list.
        </div>


        <div
            id="emptyMessage"
            class="empty-message"
        >
            No manga found.
        </div>


    </main>


    <script>

        /* =====================================================
           TELEGRAM
        ===================================================== */

        const tg =
            window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        /* =====================================================
           API
        ===================================================== */

        const API_URL =
            "https://story-about-us-api.aichinose219.workers.dev/api/manga";
        const ANNOUNCEMENT_URL = "https://story-about-us-api.aichinose219.workers.dev/api/announcement";

        async function loadAnnouncement() {
            const panel = document.getElementById("announcementPanel");
            try {
                const response = await fetch(ANNOUNCEMENT_URL);
                if (!response.ok) return;
                const info = await response.json();
                const manualItems = (info?.announcements || []).map(item => ({ ...item, kind: "announcement" }));
                const broadcastItems = (info?.broadcasts || []).map(item => ({ ...item, kind: "broadcast" }));
                const items = [];
                const rounds = Math.max(manualItems.length, broadcastItems.length);
                for (let index = 0; index < rounds; index++) {
                    if (manualItems[index]) items.push(manualItems[index]);
                    if (broadcastItems[index]) items.push(broadcastItems[index]);
                }
                if (!items.length) return;

                let currentIndex = 0;
                const message = document.getElementById("announcementMessage");
                const date = document.getElementById("announcementDate");
                const pagination = document.getElementById("announcementPagination");
                pagination.replaceChildren();
                items.forEach((item, index) => {
                    const dot = document.createElement("button");
                    dot.type = "button";
                    dot.className = "announcement-dot";
                    dot.setAttribute("aria-label", `Tampilkan informasi ${index + 1}`);
                    dot.addEventListener("click", () => showAnnouncement(index));
                    pagination.appendChild(dot);
                });

                function showAnnouncement(index) {
                    currentIndex = index;
                    const item = items[index];
                    message.textContent = item.message_text;
                    date.textContent = "";
                    date.removeAttribute("datetime");
                    if (item.updated_at) {
                        const parsed = new Date(`${item.updated_at.replace(" ", "T")}Z`);
                        if (!Number.isNaN(parsed.getTime())) {
                            date.dateTime = parsed.toISOString();
                            date.textContent = `Updated ${parsed.toLocaleDateString()}`;
                        }
                    }
                    Array.from(pagination.children).forEach((dot, dotIndex) => {
                        dot.classList.toggle("active", dotIndex === index);
                        dot.setAttribute("aria-current", dotIndex === index ? "true" : "false");
                    });
                }

                showAnnouncement(0);
                pagination.hidden = items.length < 2;
                panel.hidden = false;
                if (items.length > 1) {
                    window.setInterval(() => showAnnouncement((currentIndex + 1) % items.length), 6000);
                }
            } catch (error) {
                console.warn("Announcement could not be loaded.", error);
            }
        }


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const mangaContainer =
            document.getElementById(
                "mangaContainer"
            );

        const loading =
            document.getElementById(
                "loading"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const suggestions =
            document.getElementById(
                "suggestions"
            );

        const alphabetNav =
            document.getElementById(
                "alphabetNav"
            );


        /* =====================================================
           DATA
        ===================================================== */

        let mangaData = [];

        let favorites =
            JSON.parse(
                localStorage.getItem(
                    "storyAboutUsFavorites"
                ) || "[]"
            );


        /* =====================================================
           ALPHABET
        ===================================================== */

        const alphabet =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                .split("");


        /* =====================================================
           BACK
        ===================================================== */

        function goBack() {
            const isMobileView = new URLSearchParams(location.search).get("view") === "mobile";
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html" + (isMobileView ? "?view=mobile" : "");
            }
        }


        /* =====================================================
           OPEN MANGA
        ===================================================== */

        function openTitle(id) {

            window.location.href =
                "chapter.html?title=" +
                encodeURIComponent(id) +
                (new URLSearchParams(location.search).get("view") === "mobile" ? "&view=mobile" : "");
        }


        /* =====================================================
           FORMAT TITLE
        ===================================================== */

        function formatTitle(id) {

            return id
                .split("-")
                .map(
                    word =>
                        word.charAt(0).toUpperCase() +
                        word.slice(1)
                )
                .join(" ");
        }


        /* =====================================================
           FAVORITE
        ===================================================== */

        function toggleFavorite(
            event,
            id
        ) {

            event.stopPropagation();

            const index =
                favorites.indexOf(id);


            if (index === -1) {

                favorites.push(id);

            } else {

                favorites.splice(index, 1);
            }


            localStorage.setItem(
                "storyAboutUsFavorites",
                JSON.stringify(favorites)
            );


            renderManga();
        }


        /* =====================================================
           LOAD MANGA
        ===================================================== */

        async function loadManga() {

            try {

                loading.style.display =
                    "block";

                errorMessage.classList.remove(
                    "show"
                );


                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        "API request failed"
                    );
                }


                const data =
                    await response.json();


                mangaData =
                    (Array.isArray(data) ? data : []).map((manga) => {
                        const id = String(manga.id || "");
                        const title = String(manga.title || "").trim();
                        return title && title.toLowerCase() !== id.toLowerCase()
                            ? manga
                            : { ...manga, title: formatTitle(id) };
                    });


                /*
                 * A-Z
                 *
                 * Menggunakan title dari API.
                 */

                mangaData.sort(
                    (a, b) =>
                        (
                            a.title ||
                            formatTitle(a.id)
                        ).localeCompare(
                            (
                                b.title ||
                                formatTitle(b.id)
                            ),
                            undefined,
                            {
                                sensitivity: "base"
                            }
                        )
                );


                loading.style.display =
                    "none";


                renderManga();

                renderAlphabet();


            } catch (error) {

                console.error(
                    error
                );


                loading.style.display =
                    "none";

                errorMessage.classList.add(
                    "show"
                );
            }
        }


        /* =====================================================
           GET FIRST LETTER
        ===================================================== */

        function getFirstLetter(manga) {

            const title =
                manga.title ||
                formatTitle(manga.id);


            const first =
                title
                    .trim()
                    .charAt(0)
                    .toUpperCase();


            return /^[A-Z]$/.test(first)
                ? first
                : "#";
        }


        /* =====================================================
           GROUP MANGA
        ===================================================== */

        function groupManga() {

            const groups = {};


            mangaData.forEach(
                manga => {

                    const letter =
                        getFirstLetter(manga);


                    if (!groups[letter]) {

                        groups[letter] = [];
                    }


                    groups[letter].push(
                        manga
                    );
                }
            );


            return groups;
        }


        /* =====================================================
           RENDER ALPHABET
        ===================================================== */

        function renderAlphabet() {

            alphabetNav.innerHTML =
                "";


            const groups =
                groupManga();


            alphabet.forEach(
                letter => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "alphabet-letter";


                    button.textContent =
                        letter;


                    /*
                     * Hanya aktif jika
                     * huruf tersebut ada
                     */

                    if (
                        groups[letter] &&
                        groups[letter].length
                    ) {

                        button.classList.add(
                            "active"
                        );


                        button.onclick =
                            () =>
                                scrollToLetter(
                                    letter
                                );
                    }


                    alphabetNav.appendChild(
                        button
                    );
                }
            );
        }


        /* =====================================================
           SCROLL TO LETTER
        ===================================================== */

        function scrollToLetter(
            letter
        ) {

            const section =
                document.getElementById(
                    "letter-" + letter
                );


            if (!section) return;


            section.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }


        /* =====================================================
           RENDER MANGA
        ===================================================== */

        let activeView = "home";
        let readingEntries = [];

        function renderManga() {

            mangaContainer.innerHTML =
                "";


            let visibleManga = mangaData;
            if (activeView === "favorites") {
                visibleManga = mangaData.filter(manga => favorites.includes(manga.id));
            } else if (activeView === "last-read") {
                const progressById = new Map(readingEntries.map(entry => [entry.manga_id, entry]));
                visibleManga = readingEntries
                    .map(entry => mangaData.find(manga => manga.id === entry.manga_id))
                    .filter(Boolean);
                visibleManga = [...new Map(visibleManga.map(manga => [manga.id, manga])).values()];
                visibleManga.sort((a, b) => new Date(progressById.get(b.id)?.updated_at || 0) - new Date(progressById.get(a.id)?.updated_at || 0));
            }

            if (visibleManga.length === 0) {

                emptyMessage.classList.add(
                    "show"
                );

                return;
            }


            emptyMessage.classList.remove(
                "show"
            );


            if (activeView !== "home") {
                const grid = document.createElement("div");
                grid.className = "manga-grid";
                visibleManga.forEach(manga => {
                    const card = createMangaCard(manga);
                    if (activeView === "last-read") {
                        const entry = readingEntries.find(item => item.manga_id === manga.id);
                        card.onclick = () => {
                            location.href = `reader.html?title=${encodeURIComponent(manga.id)}&chapter=${encodeURIComponent(entry?.chapter_number || 1)}&page=${encodeURIComponent(entry?.page_number || 1)}${new URLSearchParams(location.search).get("view") === "mobile" ? "&view=mobile" : ""}`;
                        };
                        const label = document.createElement("p");
                        label.className = "last-read-label";
                        label.textContent = `Chapter ${entry?.chapter_number ?? "-"} · Halaman ${entry?.page_number ?? "-"}`;
                        card.appendChild(label);
                    }
                    grid.appendChild(card);
                });
                mangaContainer.appendChild(grid);
                return;
            }

            const groups = groupManga();


            /*
             * A-Z
             */

            alphabet.forEach(
                letter => {

                    if (
                        !groups[letter]
                    ) {
                        return;
                    }


                    /*
                     * Section huruf
                     */

                    const section =
                        document.createElement(
                            "section"
                        );


                    section.className =
                        "letter-section";


                    section.id =
                        "letter-" +
                        letter;


                    /*
                     * Judul huruf
                     */

                    const heading =
                        document.createElement(
                            "h2"
                        );


                    heading.className =
                        "letter-title";


                    heading.textContent =
                        letter;


                    section.appendChild(
                        heading
                    );


                    /*
                     * Grid
                     */

                    const grid =
                        document.createElement(
                            "div"
                        );


                    grid.className =
                        "manga-grid";


                    /*
                     * Manga sudah
                     * A-Z dari loadManga()
                     */

                    groups[letter].forEach(
                        manga => {

                            grid.appendChild(
                                createMangaCard(
                                    manga
                                )
                            );
                        }
                    );


                    section.appendChild(
                        grid
                    );


                    mangaContainer.appendChild(
                        section
                    );
                }
            );
        }


        /* =====================================================
           CREATE CARD
        ===================================================== */

        function createMangaCard(
            manga
        ) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "manga-card";

            const cardStatus = ["end", "end-season", "hiatus"].includes(manga.status)
                ? manga.status
                : "ongoing";
            if (cardStatus !== "ongoing") card.classList.add(`status-${cardStatus}`);


            card.onclick =
                () =>
                    openTitle(
                        manga.id
                    );


            /* COVER */

            const coverWrapper =
                document.createElement(
                    "div"
                );


            coverWrapper.className =
                "cover-wrapper";


            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "manga-cover";


            img.alt =
                manga.title ||
                formatTitle(
                    manga.id
                );


            img.loading =
                "lazy";


            if (manga.cover) {

                img.src =
                    manga.cover;

            } else {

                img.src =
                    "https://cdn.storyabout-us.com/Theme/homepage-bg.png";
            }


            img.onerror =
                function () {

                    this.src =
                        "https://cdn.storyabout-us.com/Theme/homepage-bg.png";
                };


            coverWrapper.appendChild(
                img
            );


            /* BOTTOM */

            const bottom =
                document.createElement(
                    "div"
                );


            bottom.className =
                "card-bottom";


            /* TITLE */

            const title =
                document.createElement(
                    "h2"
                );


            title.className =
                "manga-title";


            title.textContent =
                manga.title ||
                formatTitle(
                    manga.id
                );


            /* FAVORITE */

            const favorite =
                document.createElement(
                    "button"
                );


            favorite.type =
                "button";


            favorite.className =
                "favorite-button";


            const isFavorite =
                favorites.includes(
                    manga.id
                );


            favorite.textContent =
                isFavorite
                    ? "♥"
                    : "♡";


            if (isFavorite) {

                favorite.classList.add(
                    "active"
                );
            }


            favorite.onclick =
                event =>
                    toggleFavorite(
                        event,
                        manga.id
                    );


            bottom.appendChild(
                title
            );

            bottom.appendChild(
                favorite
            );


            card.appendChild(
                coverWrapper
            );

            card.appendChild(
                bottom
            );


            return card;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        searchInput.addEventListener(
            "input",
            function () {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    suggestions.innerHTML =
                        "";

                    suggestions.classList.remove(
                        "show"
                    );

                    return;
                }


                const results =
                    mangaData.filter(
                        manga => {

                            const title =
                                (
                                    manga.title ||
                                    formatTitle(
                                        manga.id
                                    )
                                ).toLowerCase();


                            const id =
                                (
                                    manga.id ||
                                    ""
                                ).toLowerCase();


                            return (
                                title.includes(
                                    query
                                ) ||
                                id.includes(
                                    query
                                )
                            );
                        }
                    );


                suggestions.innerHTML =
                    "";


                if (
                    results.length === 0
                ) {

                    const noResult =
                        document.createElement(
                            "div"
                        );


                    noResult.className =
                        "no-suggestion";


                    noResult.textContent =
                        "No manga found";


                    suggestions.appendChild(
                        noResult
                    );


                    suggestions.classList.add(
                        "show"
                    );

                    return;
                }


                results.forEach(
                    manga => {

                        const item =
                            document.createElement(
                                "button"
                            );


                        item.type =
                            "button";


                        item.className =
                            "suggestion-item";


                        item.textContent =
                            manga.title ||
                            formatTitle(
                                manga.id
                            );


                        item.onclick =
                            () =>
                                openTitle(
                                    manga.id
                                );


                        suggestions.appendChild(
                            item
                        );
                    }
                );


                suggestions.classList.add(
                    "show"
                );
            }
        );


        /* =====================================================
           CLOSE SEARCH
        ===================================================== */

        document.addEventListener(
            "click",
            function (event) {

                if (
                    !event.target.closest(
                        ".search-container"
                    )
                ) {

                    suggestions.classList.remove(
                        "show"
                    );
                }
            }
        );


        /* =====================================================
           START
        ===================================================== */


        const accountTabs = document.getElementById("accountTabs");
        const loginButton = document.getElementById("telegramLoginButton");
        const adminButton = document.querySelector('.hero-actions .admin-link[href="admin.html"]');
        const accountTabButtons = [...accountTabs.querySelectorAll("[data-view]")];

        function updateAccountNavigation() {
            const isTelegram = document.documentElement.classList.contains("telegram-view");
            const loggedIn = ReaderAccount.authenticated;
            loginButton.hidden = !isTelegram || loggedIn;
            accountTabs.hidden = !isTelegram || !loggedIn;
            adminButton.hidden = isTelegram && loggedIn;
            if (loggedIn) loadReadingHistory();
        }

        accountTabButtons.forEach(button => {
            button.addEventListener("click", () => {
                activeView = button.dataset.view;
                accountTabButtons.forEach(tab => tab.classList.toggle("active", tab === button));
                if (activeView === "last-read") loadReadingHistory();
                renderManga();
            });
        });

        loginButton.addEventListener("click", async () => {
            loginButton.disabled = true;
            try {
                await ReaderAccount.login();
                updateAccountNavigation();
            } catch (error) {
                window.alert(error.message || "Login Telegram gagal.");
            } finally {
                loginButton.disabled = false;
            }
        });

        ReaderAccount.init().then(updateAccountNavigation);

        async function loadReadingHistory() {
            try {
                const response = await ReaderAccount.apiFetch("https://story-about-us-api.aichinose219.workers.dev/api/history");
                if (!response.ok) throw new Error("Riwayat belum tersedia.");
                readingEntries = await response.json();
                if (activeView === "last-read") renderManga();
            } catch (error) {
                console.error("Gagal memuat riwayat baca:", error);
            }
        }
