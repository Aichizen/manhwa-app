<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>STORY ABOUT US</title>

    <link rel="stylesheet" href="style.css">

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div id="app">

        <header class="header">
            <button class="menu-btn">☰</button>

            <h1>STORY ABOUT US</h1>

            <button class="search-btn">⌕</button>
        </header>


        <main>

            <!-- Cover -->
            <section class="cover-section">
                <img
                    src="image/covers/evil-deed.png"
                    class="cover"
                    alt="Cover"
                >
            </section>


            <!-- Informasi -->
            <section class="info">

                <h2>Judul Manhwa</h2>

                <div class="rating">
                    ⭐ 9.2
                    <span>•</span>
                    65 Chapters
                </div>

                <p class="description">
                    Deskripsi singkat mengenai manhwa.
                </p>

                <div class="buttons">
                    <button>🔖 Bookmark</button>
                    <button>❤️ Follow</button>
                </div>

            </section>


            <!-- Chapter -->
            <section class="chapters">

                <h2>Chapters</h2>

                <div class="chapter">
                    <button onclick="openReader()">Chapter 1</button>
                    <span>›</span>
                </div>

                <div class="chapter">
                    <span>Chapter 2</span>
                    <span>✓</span>
                </div>

                <div class="chapter">
                    <span>Chapter 3</span>
                    <span>✓</span>
                </div>

                <div class="chapter">
                    <span>Chapter 4</span>
                    <span>✓</span>
                </div>

            </section>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
