<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Story About Us</title>
  <style>
    :root { color-scheme:dark; --text:#f4f2fa; --muted:#bbb7cc; --accent:#d4b1ff; --line:rgba(255,255,255,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(rgba(10,10,28,.4),rgba(10,10,28,.62)),url("homepage-bg.png") center/cover fixed; }
    main { width:min(100%,760px); margin:auto; }
    a { color:inherit; text-decoration:none; }
    .back { display:inline-block; margin-bottom:22px; color:var(--muted); }
    .panel { padding:clamp(22px,5vw,40px); border:1px solid var(--line); border-radius:20px; background:rgba(24,22,42,.84); backdrop-filter:blur(10px); }
    h1 { margin:0 0 8px; font:clamp(30px,6vw,42px)/1.1 Georgia,"Times New Roman",serif; }
    .intro { margin:0 0 26px; color:var(--muted); }
    .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .choice { display:block; min-height:170px; padding:22px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.06); transition:transform .2s ease,background .2s ease,border-color .2s ease; }
    .choice:hover { transform:translateY(-3px); background:rgba(196,156,255,.13); border-color:rgba(212,177,255,.55); }
    .choice-icon { display:block; margin-bottom:18px; color:var(--accent); font-size:26px; }
    .choice strong { display:block; margin-bottom:6px; font-size:19px; }
    .choice span:last-child { color:var(--muted); font-size:14px; }
    @media(max-width:520px) { .choices { grid-template-columns:1fr; } .choice { min-height:140px; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Back to Homepage</a>
    <section class="panel">
      <h1>Admin Panel</h1>
      <p class="intro">Pilih tindakan yang ingin dilakukan.</p>
      <nav class="choices" aria-label="Admin actions">
        <a class="choice" href="add-manhwa.html">
          <span class="choice-icon" aria-hidden="true">＋</span>
          <strong>Add Manhwa</strong>
          <span>Tambahkan manhwa, cover, summary opsional, dan Chapter 1.</span>
        </a>
        <a class="choice" href="add-chapter.html">
          <span class="choice-icon" aria-hidden="true">⇧</span>
          <strong>Add Chapter</strong>
          <span>Unggah chapter berikutnya ke manhwa yang sudah ada.</span>
        </a>
        <a class="choice" href="edit-manhwa.html">
          <span class="choice-icon" aria-hidden="true">✎</span>
          <strong>Edit Manhwa</strong>
          <span>Ganti atau hapus PDF chapter manhwa yang sudah ada.</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
