server {
    listen 80;
    server_name _;
    client_max_body_size 55m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /api/ {
        proxy_pass https://story-about-us-api.aichinose219.workers.dev;
        proxy_http_version 1.1;
        proxy_set_header Host story-about-us-api.aichinose219.workers.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name story-about-us-api.aichinose219.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /worker.js { return 404; }
    location = /vercel.json { return 404; }
    location = /Dockerfile { return 404; }
    location = /compose.yaml { return 404; }
    location = /nginx.conf { return 404; }
    location ~* \.md$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
